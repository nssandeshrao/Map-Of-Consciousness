<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map of Consciousness</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: rgba(255,255,255,0.07);
    --text: #e8e6f0;
    --muted: rgba(232,230,240,0.45);
    --victim: #c0392b;
    --victim-dim: #4a1515;
    --empower: #c47d1a;
    --empower-dim: #4a2e08;
    --realize: #1a9e75;
    --realize-dim: #083d2c;
    --spirit: #7f77dd;
    --spirit-dim: #2a2660;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px 80px; }
  header { text-align: center; margin-bottom: 32px; }
  header h1 { font-family: 'DM Serif Display', serif; font-size: clamp(26px,5vw,44px); font-weight: 400; color: var(--text); }
  header p { font-size: 12px; color: var(--muted); margin-top: 6px; letter-spacing: 0.08em; text-transform: uppercase; }
  .tabs { display: flex; gap: 4px; background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 28px; }
  .tab { padding: 8px 28px; font-family: 'DM Mono', monospace; font-size: 13px; border-radius: 9px; border: none; cursor: pointer; background: transparent; color: var(--muted); transition: all 0.2s; letter-spacing: 0.04em; }
  .tab.active { background: rgba(127,119,221,0.18); color: #b3b0ff; }
  .main { width: 100%; max-width: 860px; }
  .panel { display: none; flex-direction: column; gap: 24px; }
  .panel.visible { display: flex; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  .chart-wrap { position: relative; background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px; padding: 28px 20px 36px; overflow: hidden; }
  .bars { position: relative; height: 340px; display: flex; align-items: flex-end; gap: 4px; z-index: 2; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; cursor: pointer; position: relative; height: 100%; }
  .bar { width: 100%; border-radius: 4px 4px 0 0; transition: all 0.25s ease; opacity: 0.35; }
  .bar-col.active .bar { opacity: 1; }
  .bar-col:hover .bar { opacity: 0.75; }
  .bar-col.active:hover .bar { opacity: 1; }
  .bar-log { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); font-size: 9px; color: var(--muted); white-space: nowrap; }
  .cursor-line { position: absolute; left: 20px; right: 20px; height: 1.5px; z-index: 5; pointer-events: none; transition: top 0.3s cubic-bezier(0.4,0,0.2,1); }
  .cursor-line::before { content: ''; position: absolute; left: 0; right: 0; height: 100%; background: white; opacity: 0.9; }
  .cursor-label { position: absolute; right: 0; top: -18px; font-size: 10px; color: white; background: var(--surface); padding: 2px 6px; border-radius: 4px; border: 0.5px solid rgba(255,255,255,0.2); white-space: nowrap; }
  .cursor-tri { position: absolute; left: -8px; top: -4px; width: 0; height: 0; border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; border-right: 8px solid white; }
  .detail-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px; padding: 24px 28px; transition: border-color 0.3s; }
  .detail-top { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; flex-wrap: wrap; }
  .detail-log { font-family: 'DM Serif Display', serif; font-size: 52px; line-height: 1; font-style: italic; }
  .detail-level { font-family: 'DM Serif Display', serif; font-size: 28px; }
  .detail-mode { font-size: 11px; padding: 4px 12px; border-radius: 20px; letter-spacing: 0.05em; text-transform: uppercase; margin-left: auto; }
  .drive-quote { font-size: 13px; color: var(--muted); font-style: italic; font-family: 'DM Serif Display', serif; margin-bottom: 20px; padding-left: 12px; border-left: 2px solid var(--border); }
  .hbar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .hbar-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; min-width: 76px; }
  .hbar-track { flex: 1; height: 4px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden; }
  .hbar-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
  .hbar-pct { font-size: 12px; min-width: 34px; text-align: right; }
  .attrs { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px 20px; }
  .attr-cell { display: flex; flex-direction: column; gap: 3px; }
  .attr-key { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
  .attr-val { font-size: 13px; }
  .nav { display: flex; align-items: center; gap: 12px; justify-content: center; }
  .nav-btn { background: var(--surface); border: 0.5px solid rgba(255,255,255,0.12); color: var(--text); font-family: 'DM Mono', monospace; font-size: 12px; padding: 8px 20px; border-radius: 8px; cursor: pointer; letter-spacing: 0.04em; transition: background 0.15s; }
  .nav-btn:hover { background: rgba(255,255,255,0.06); }
  .nav-count { font-size: 11px; color: var(--muted); min-width: 52px; text-align: center; }
  .key-hint { font-size: 10px; color: var(--muted); text-align: center; letter-spacing: 0.05em; text-transform: uppercase; }
  .quiz-wrap { display: flex; flex-direction: column; gap: 16px; }
  .prog-row { display: flex; align-items: center; gap: 10px; }
  .prog-track { flex: 1; height: 4px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden; }
  .prog-fill { height: 100%; background: #7f77dd; border-radius: 2px; transition: width 0.3s ease; }
  .prog-lbl { font-size: 12px; color: var(--muted); min-width: 40px; text-align: right; }
  .q-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px; padding: 20px 20px 16px; }
  .q-text { font-size: 15px; font-weight: 500; margin-bottom: 16px; line-height: 1.5; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt { padding: 11px 14px; border: 0.5px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text); cursor: pointer; transition: background 0.12s, border-color 0.12s; text-align: left; background: transparent; font-family: 'DM Mono', monospace; }
  .opt:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.15); }
  .opt.selected { background: rgba(127,119,221,0.15); border-color: #7f77dd; color: #b3b0ff; }
  .qnav-row { display: flex; gap: 10px; justify-content: flex-end; }
  .qbtn { padding: 8px 20px; font-size: 13px; font-family: 'DM Mono', monospace; border: 0.5px solid rgba(255,255,255,0.15); border-radius: 8px; background: transparent; color: var(--text); cursor: pointer; transition: background 0.15s; }
  .qbtn:hover { background: rgba(255,255,255,0.06); }
  .qbtn:disabled { opacity: 0.3; cursor: default; }
  .qbtn.primary { background: #7f77dd; border-color: #7f77dd; color: #fff; }
  .qbtn.primary:hover { background: #534ab7; }
  .qbtn.primary:disabled { background: rgba(127,119,221,0.3); border-color: transparent; }
  .result-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px; padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 20px; }
  .res-top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .res-log { font-family: 'DM Serif Display', serif; font-size: 52px; line-height: 1; font-style: italic; }
  .res-level { font-family: 'DM Serif Display', serif; font-size: 26px; }
  .res-badge { font-size: 11px; padding: 4px 12px; border-radius: 20px; letter-spacing: 0.05em; text-transform: uppercase; margin-left: auto; }
  .res-drive { font-size: 13px; color: var(--muted); font-style: italic; font-family: 'DM Serif Display', serif; padding-left: 12px; border-left: 2px solid var(--border); }
  .res-attrs { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px 16px; }
  .res-attr { display: flex; flex-direction: column; gap: 2px; }
  .res-k { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .res-v { font-size: 13px; }
  .section-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
  .report-block { background: rgba(255,255,255,0.03); border: 0.5px solid var(--border); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .report-row { display: flex; align-items: flex-start; gap: 12px; }
  .report-icon { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; margin-top: 1px; }
  .report-text { font-size: 13px; line-height: 1.6; color: var(--text); }
  .report-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 2px; }
  .suggestion-list { display: flex; flex-direction: column; gap: 10px; }
  .sug-item { display: flex; gap: 12px; align-items: flex-start; background: rgba(255,255,255,0.03); border: 0.5px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .sug-num { width: 24px; height: 24px; border-radius: 50%; background: rgba(127,119,221,0.2); color: #b3b0ff; font-size: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
  .sug-body { flex: 1; }
  .sug-title { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .sug-desc { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .next-level-banner { border-radius: 12px; padding: 16px 18px; display: flex; align-items: center; gap: 16px; }
  .nl-log { font-family: 'DM Serif Display', serif; font-size: 36px; font-style: italic; line-height: 1; }
  .nl-body { flex: 1; }
  .nl-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; opacity: 0.7; margin-bottom: 4px; }
  .nl-level { font-size: 18px; font-weight: 500; }
  .nl-desc { font-size: 12px; opacity: 0.75; margin-top: 3px; line-height: 1.5; }
  .res-btns { display: flex; gap: 10px; flex-wrap: wrap; }
  @media(max-width:560px){ .attrs,.res-attrs{ grid-template-columns: repeat(2,1fr); } .detail-log,.res-log{ font-size:36px; } .detail-level,.res-level{ font-size:20px; } }
</style>
</head>
<body>
<header>
  <h1>Map of Consciousness</h1>
  <p>Dr. David R. Hawkins · Scale of Human Awareness</p>
</header>
<div class="tabs">
  <button class="tab active" onclick="showTab('chart')">Chart</button>
  <button class="tab" onclick="showTab('quiz')">Self-Assessment Quiz</button>
</div>
<div class="main">
  <div class="panel visible" id="panel-chart">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--victim)"></div>Victim / Abuser</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--empower)"></div>Self-Empowerment</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--realize)"></div>Self-Realization</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--spirit)"></div>Spiritual</div>
    </div>
    <div class="chart-wrap" id="chartWrap">
      <div class="cursor-line" id="cursorLine">
        <div class="cursor-tri"></div>
        <div class="cursor-label" id="cursorLabel">200 · Courage</div>
      </div>
      <div class="bars" id="barsEl"></div>
    </div>
    <div class="detail-card" id="detailCard">
      <div class="detail-top">
        <span class="detail-log" id="dLog">200</span>
        <span class="detail-level" id="dLevel">Courage</span>
        <span class="detail-mode" id="dMode"></span>
      </div>
      <div class="drive-quote" id="dDrive"></div>
      <div class="hbar-row">
        <span class="hbar-lbl">Happiness</span>
        <div class="hbar-track"><div class="hbar-fill" id="happFill"></div></div>
        <span class="hbar-pct" id="happPct"></span>
      </div>
      <div class="attrs" id="attrsGrid"></div>
    </div>
    <div class="nav">
      <button class="nav-btn" onclick="move(-1)">← prev</button>
      <span class="nav-count" id="navCount">9 / 17</span>
      <button class="nav-btn" onclick="move(1)">next →</button>
    </div>
    <div class="key-hint">or use ← → arrow keys</div>
  </div>
  <div class="panel" id="panel-quiz">
    <div class="quiz-wrap">
      <div class="prog-row">
        <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
        <span class="prog-lbl" id="progLbl">0 / 20</span>
      </div>
      <div id="qArea"></div>
    </div>
  </div>
</div>
<script>
const levels=[
  {log:20,level:"Shame",lifeView:"Miserable",emotion:"Humiliation",godView:"Despising",process:"Elimination",drive:"I don't want to survive",happiness:1,pop:"78%",mode:"Victim/Abuser"},
  {log:30,level:"Guilt",lifeView:"Evil",emotion:"Blame",godView:"Vindictive",process:"Destruction",drive:"No one needs to survive",happiness:4,pop:"78%",mode:"Victim/Abuser"},
  {log:50,level:"Apathy",lifeView:"Hopeless",emotion:"Despair",godView:"Condemning",process:"Abdication",drive:"Why would anyone want to survive",happiness:5,pop:"78%",mode:"Victim/Abuser"},
  {log:75,level:"Grief",lifeView:"Tragic",emotion:"Regret",godView:"Disdainful",process:"Despondency",drive:"You don't survive so I don't",happiness:9,pop:"78%",mode:"Victim/Abuser"},
  {log:100,level:"Fear",lifeView:"Frightening",emotion:"Anxiety",godView:"Punitive",process:"Withdrawal",drive:"I only survive if you don't",happiness:10,pop:"78%",mode:"Victim/Abuser"},
  {log:125,level:"Desire",lifeView:"Disappointing",emotion:"Craving",godView:"Denying",process:"Enslavement",drive:"I only survive if others give me what I want",happiness:10,pop:"78%",mode:"Victim/Abuser"},
  {log:150,level:"Anger",lifeView:"Antagonistic",emotion:"Hate",godView:"Vengeful",process:"Aggression",drive:"I can only survive if I control others",happiness:12,pop:"78%",mode:"Victim/Abuser"},
  {log:175,level:"Pride",lifeView:"Demanding",emotion:"Scorn",godView:"Indifferent",process:"Inflation",drive:"I have to help others in order to survive",happiness:22,pop:"78%",mode:"Victim/Abuser"},
  {log:200,level:"Courage",lifeView:"Feasible",emotion:"Affirmation",godView:"Permitting",process:"Empowerment",drive:"I can survive even if others can't",happiness:55,pop:"18%",mode:"Self-Empowerment"},
  {log:250,level:"Neutrality",lifeView:"Satisfactory",emotion:"Trust",godView:"Enabling",process:"Release",drive:"I trust the universe to help me",happiness:60,pop:"18%",mode:"Self-Empowerment"},
  {log:310,level:"Willingness",lifeView:"Hopeful",emotion:"Optimism",godView:"Inspiring",process:"Intention",drive:"Life is good",happiness:68,pop:"18%",mode:"Self-Empowerment"},
  {log:350,level:"Acceptance",lifeView:"Harmonious",emotion:"Forgiveness",godView:"Merciful",process:"Transcendence",drive:"People are inherently good",happiness:71,pop:"18%",mode:"Self-Empowerment"},
  {log:400,level:"Reason",lifeView:"Meaningful",emotion:"Understanding",godView:"Wise",process:"Abstraction",drive:"Everyone is capable of learning",happiness:79,pop:"18%",mode:"Self-Empowerment"},
  {log:500,level:"Love",lifeView:"Benign",emotion:"Reverence",godView:"Loving",process:"Revelation",drive:"We can all share in happiness",happiness:89,pop:"3.99%",mode:"Self-Realization"},
  {log:540,level:"Joy",lifeView:"Complete",emotion:"Serenity",godView:"One",process:"Transfiguration",drive:"Your joy is my joy",happiness:96,pop:"0.40%",mode:"Self-Realization"},
  {log:600,level:"Peace",lifeView:"Perfect",emotion:"Bliss",godView:"All-Being",process:"Illumination",drive:"Good of mankind",happiness:100,pop:"722 persons",mode:"Spiritual"},
  {log:1000,level:"Enlightenment",lifeView:"Is",emotion:"Ineffable",godView:"Self",process:"Pure-Consciousness",drive:"Salvation of humanity",happiness:100,pop:"722 persons",mode:"Spiritual"},
];
const modeColors={
  "Victim/Abuser":{bright:"#c0392b",dim:"#4a1515",badge:"background:#4a1515;color:#ff8a80",hap:"#c0392b",banner:"background:rgba(192,57,43,0.12);color:#ff8a80"},
  "Self-Empowerment":{bright:"#c47d1a",dim:"#4a2e08",badge:"background:#4a2e08;color:#ffcc80",hap:"#c47d1a",banner:"background:rgba(196,125,26,0.12);color:#ffcc80"},
  "Self-Realization":{bright:"#1a9e75",dim:"#083d2c",badge:"background:#083d2c;color:#80cbc4",hap:"#1a9e75",banner:"background:rgba(26,158,117,0.12);color:#80cbc4"},
  "Spiritual":{bright:"#7f77dd",dim:"#2a2660",badge:"background:#2a2660;color:#b3b0ff",hap:"#7f77dd",banner:"background:rgba(127,119,221,0.12);color:#b3b0ff"},
};
const suggestions={
  "Victim/Abuser":{
    20:[{t:"Practice self-compassion daily",d:"Write one kind sentence to yourself each morning. You are not your worst moments. Shame dissolves through self-forgiveness, not self-punishment."},{t:"Seek professional support",d:"A therapist or counsellor can provide a safe space to process deep shame. You don't have to carry this alone."},{t:"Find one reason to stay present",d:"Identify a single person, pet, or purpose that gives you a reason to engage with today. Start there."},{t:"Limit isolation",d:"Even brief contact with a trusted person — a call, a message — begins to loosen shame's grip."},{t:"Read about others who healed from shame",d:"Stories of recovery show that your current state is not permanent. Brené Brown's work on shame resilience is a powerful starting point."}],
    30:[{t:"Distinguish guilt from shame",d:"Guilt says 'I did something bad.' Shame says 'I am bad.' Focus on the action, not your identity. Actions can change."},{t:"Make one small amend",d:"If guilt is tied to a specific action, a small step toward repair — even just acknowledging it internally — begins to release it."},{t:"Start a forgiveness journal",d:"Each day write one thing you forgive yourself for. Not to excuse it, but to stop punishing yourself for it endlessly."},{t:"Practice mindfulness",d:"Guilt lives in the past. Mindfulness brings you to the present moment where guilt has no power. Even 5 minutes a day makes a difference."},{t:"Talk to someone you trust",d:"Saying your guilt out loud to a trusted person almost always makes it smaller. Secrets give guilt its power."}],
    50:[{t:"Take one tiny action each day",d:"Apathy is broken by movement, not motivation. Don't wait to feel like doing something — do one tiny thing and let the feeling follow."},{t:"Get sunlight and movement",d:"Even a 10-minute walk outside has measurable effects on energy and mood. Your body affects your consciousness."},{t:"Reduce numbing behaviours",d:"Identify what you use to avoid feeling — screens, food, alcohol — and reduce it slightly. Feeling something, even sadness, is better than nothing."},{t:"Connect with one living thing",d:"A plant, a pet, a child. Something that needs you. Responsibility is a powerful antidote to apathy."},{t:"Lower the bar radically",d:"Don't aim for happiness. Aim for slightly less hopeless. Small wins build momentum."}],
    75:[{t:"Allow grief to move through you",d:"Grief that is resisted stays stuck. Cry if you need to. Write about what you've lost. Let it be felt rather than pushed down."},{t:"Join a support group",d:"Shared grief is lighter grief. Others who understand your loss can help you feel less alone in it."},{t:"Create a ritual of remembrance",d:"If your grief is tied to a loss, create a small ritual — lighting a candle, visiting a place — to honour it without being consumed by it."},{t:"Look for what remains",d:"Grief focuses on what's gone. Gently ask: what is still here? What has not been lost? This is not denial — it's balance."},{t:"Move your body",d:"Grief is stored in the body. Gentle yoga, walking, or even dancing alone can release trapped emotional energy."}],
    100:[{t:"Name your fear precisely",d:"Vague fear is more powerful than named fear. Write down exactly what you are afraid of. Specificity reduces anxiety's hold."},{t:"Practice slow breathing",d:"Fear activates the nervous system. Four counts in, six counts out. Do this for two minutes when fear rises and watch it reduce."},{t:"Take one small action toward the fear",d:"Avoidance grows fear. Approach shrinks it. Identify the smallest possible step toward what you fear and take it today."},{t:"Challenge catastrophic thinking",d:"Ask: what is the most realistic outcome, not the worst? Fear exaggerates. Reality is usually more manageable."},{t:"Build a safety net",d:"Fear often reflects real vulnerability. Practical steps — savings, skills, relationships — reduce the legitimate basis for fear."}],
    125:[{t:"Notice the gap between wanting and having",d:"Desire at this level creates endless craving. Practice pausing between the urge and the action. The pause builds freedom."},{t:"Practice gratitude for what you have",d:"Desire says 'not enough.' Gratitude says 'enough.' Write three things you already have that you once wanted."},{t:"Distinguish needs from wants",d:"Are your desires meeting a genuine need (connection, security, respect) or just filling a void? Understanding the real need opens better solutions."},{t:"Reduce media and advertising exposure",d:"Much of desire is manufactured. Reducing the inputs that create artificial wants is a form of mental hygiene."},{t:"Explore mindful consumption",d:"Before any purchase or indulgence, pause 24 hours. Most cravings pass. Those that remain are more likely to be genuine."}],
    150:[{t:"Identify the hurt beneath the anger",d:"Anger is almost always a secondary emotion covering hurt, fear, or injustice. Ask: what am I really feeling underneath this?"},{t:"Use physical outlets",d:"Anger is energy. Exercise, sport, or physical work gives it a healthy channel rather than letting it explode at people."},{t:"Practice the pause",d:"Between the trigger and the response, create a pause. Even counting to ten changes the neurological pattern of reactive anger."},{t:"Learn assertive communication",d:"Anger often comes from unmet needs that were never voiced. Saying 'I feel X when Y happens' is more powerful than rage."},{t:"Forgiveness as a practice",d:"Forgiveness doesn't excuse the other person. It frees you from carrying their weight. Start small — forgive one minor slight per week."}],
    175:[{t:"Notice when pride becomes a defence",d:"Pride at this level uses superiority to avoid vulnerability. Ask: where am I using 'being better' to avoid feeling not enough?"},{t:"Practice genuine curiosity about others",d:"Ask people questions and actually listen. Pride closes us off. Curiosity opens us up and reveals that others have much to teach."},{t:"Acknowledge one mistake per day",d:"Pride hates admitting error. Deliberately acknowledging small mistakes builds the humility muscle that opens the door to Courage."},{t:"Find a mentor or teacher",d:"Placing yourself in a learning position where someone else knows more dismantles the need to be the best in the room."},{t:"Volunteer or serve anonymously",d:"Helping others without recognition breaks the link between helping and ego-reward that keeps Pride stuck."}],
  },
  "Self-Empowerment":{
    200:[{t:"Expand your comfort zone deliberately",d:"Courage grows by action. Each week, do one thing that slightly scares you. Over time, your threshold of what feels manageable expands dramatically."},{t:"Build self-trust through kept promises",d:"Make small commitments to yourself and keep them. Each kept promise builds the internal credibility that deepens courage."},{t:"Surround yourself with courageous people",d:"Consciousness is contagious. People who operate at Neutrality or Acceptance will naturally elevate your baseline."},{t:"Study what you fear",d:"Knowledge reduces fear. If you fear failure, study resilience. If you fear judgement, study stoicism. Understanding disarms threats."},{t:"Reframe failure as information",d:"Courage increases when failure is no longer catastrophic. Every failure tells you something useful. Begin treating it that way."}],
    250:[{t:"Deepen your trust through evidence",d:"Neutrality trusts that things will work out. Strengthen this by reviewing times in your past when things did work out even when you worried."},{t:"Reduce the need to control outcomes",d:"Neutrality releases attachment to specific results. Practice letting small things unfold without intervention."},{t:"Move toward Willingness by saying yes more",d:"Neutrality can become passive. Begin saying yes to opportunities, experiences, and connections you would normally let pass."},{t:"Develop a daily meditation practice",d:"Neutrality is a natural state for those who meditate. Even 10 minutes a day deepens equanimity and opens the door to higher levels."},{t:"Serve others without agenda",d:"Moving from Neutrality toward Willingness requires intentional contribution. Find one way per week to help without expectation of return."}],
    310:[{t:"Say yes to growth opportunities",d:"Willingness thrives on momentum. Look for courses, projects, and challenges that stretch you and embrace them with your natural optimism."},{t:"Build on your optimism with action",d:"Willingness is hopeful but can stay passive. Convert hope into specific goals with dates and steps."},{t:"Practice Acceptance by releasing judgement",d:"The next level is Acceptance. Begin noticing when you judge situations as wrong and practice allowing them to simply be."},{t:"Invest in relationships",d:"At Willingness, your positive energy attracts others. Deepen a few meaningful relationships — this is the soil Acceptance grows from."},{t:"Develop a spiritual or philosophical practice",d:"Willingness is the threshold of genuine growth. A practice — prayer, meditation, philosophy — accelerates the journey to Acceptance and beyond."}],
    350:[{t:"Extend forgiveness to your past self",d:"Acceptance often forgives others before the self. Turn that forgiveness inward — to who you were before you knew what you know now."},{t:"Practise non-resistance",d:"When difficult emotions arise, instead of pushing them away, breathe and say 'I allow this.' Acceptance is a muscle built by use."},{t:"Move toward Reason by studying wisdom traditions",d:"Reading philosophy, psychology, or spiritual texts moves you from emotional acceptance toward the intellectual clarity of Reason."},{t:"Mentor someone below your level",d:"Teaching what you know consolidates and deepens it. Find someone earlier in their journey and offer your time."},{t:"Spend time in nature",d:"Nature operates at perfect Acceptance. Time outdoors recalibrates the nervous system toward the equanimity of this level."}],
    400:[{t:"Move from knowledge to wisdom",d:"Reason can become trapped in analysis. Begin asking not just 'what is true?' but 'what is the right thing to do?' — that is the bridge to Love."},{t:"Develop emotional intelligence alongside intellect",d:"Reason sometimes bypasses feeling. Deliberately engage with how things feel, not just what they mean. Emotion is data too."},{t:"Practice compassionate listening",d:"Understanding others deeply — not just logically but emotionally — is the bridge from Reason to Love. Listen to understand, not to respond."},{t:"Let go of the need to be right",d:"Reason's shadow is intellectual pride. Practice holding your views lightly and being genuinely open to being wrong."},{t:"Serve a cause larger than yourself",d:"Reason sees clearly what needs to change in the world. Begin channelling that clarity into action for others — this is the doorway to Love."}],
  },
  "Self-Realization":{
    500:[{t:"Let love be unconditional",d:"At this level, love begins to extend beyond those close to you. Practice extending goodwill to strangers, difficult people, and even those who have hurt you."},{t:"Deepen your contemplative practice",d:"Love at Log 500 is nourished by silence and presence. Lengthen your meditation or prayer practice and sit with the feeling of love without object."},{t:"Surrender the need to fix",d:"Love wants to help. But the next levels require releasing the need to change others. Practice loving people exactly as they are."},{t:"Study the nature of the self",d:"Joy and Peace (540-600) come from recognising the deeper self beyond the personal story. Non-dual teachings point the way."},{t:"Live in the present moment",d:"Love is always now. Past regret and future anxiety pull you from this level. Each return to the present is a return to Love."}],
    540:[{t:"Recognise joy as your natural state",d:"At Joy, you begin to see that happiness is not earned or achieved — it is what remains when obstacles are removed. Sit with this truth."},{t:"Reduce all unnecessary suffering",d:"Joy is incompatible with voluntary suffering — worry, resentment, comparison. Begin dropping these as conscious choices, not forced positivity."},{t:"Share your state through presence",d:"At this level, your presence itself uplifts others. You don't need to do anything. Simply being fully present is your greatest gift."},{t:"Explore non-dual awareness",d:"The distinction between self and other begins to dissolve at Joy. Explore teachings that point to the nature of awareness itself."},{t:"Release attachment to spiritual progress",d:"Paradoxically, striving to reach Peace can prevent it. Rest in what is already here. The seeking itself is the only obstacle."}],
    600:[{t:"Abide in stillness",d:"Peace at 600 is not something you do — it is what you are when thought subsides. Your practice now is simply to rest in this recognition."},{t:"Be a presence for others",d:"At this level, your role is not to teach but to embody. Your peace is medicine for those around you without any effort on your part."},{t:"Continue without expectation",d:"The journey beyond Peace is surrendered entirely. There is nothing to attain. Simply be what you are and allow the unfolding."},{t:"Serve through love, not duty",d:"Any remaining service now flows from love and joy rather than obligation. Follow what pulls you with warmth rather than what pushes you with guilt."},{t:"Trust the process completely",d:"At Peace, resistance has dissolved. Trust is total. The path forward is not yours to plan — it reveals itself as you walk."}],
  },
  "Spiritual":{
    1000:[{t:"You are already complete",d:"At Enlightenment there is nothing to improve and nowhere to go. The journey is over. Simply be."}],
  },
};
function getSuggestions(lvl){const m=lvl.mode;const s=suggestions[m];if(!s)return[];if(s[lvl.log])return s[lvl.log];const keys=Object.keys(s).map(Number).sort((a,b)=>a-b);const closest=keys.reduce((a,b)=>Math.abs(b-lvl.log)<Math.abs(a-lvl.log)?b:a);return s[closest]||[];}
function getReport(lvl){
  const reports={
    "Victim/Abuser":{strength:"You are aware enough to take this assessment — self-awareness is itself a sign of growth. The fact that you are seeking understanding shows a part of you that wants change.",challenge:"At this level, the primary challenge is that life feels like something that is happening to you rather than something you participate in. Survival feels threatened and others are often seen as obstacles or enemies.",pattern:"The dominant pattern is reactive — responding to external events from a place of fear, anger, or collapse rather than from inner stability."},
    "Self-Empowerment":{strength:"You have crossed the critical threshold of 200 — this is one of the most significant leaps on the entire scale. You possess genuine inner resources and the capacity to navigate life's challenges.",challenge:"The primary growth edge is moving from personal empowerment to genuine care for others. The risk at this level is using your strength primarily for personal gain rather than shared flourishing.",pattern:"The dominant pattern is proactive — you take responsibility for your outcomes and possess real agency. The next step is extending that agency outward in service of others."},
    "Self-Realization":{strength:"You operate from a fundamentally positive orientation toward life and others. Love, understanding, and forgiveness are natural parts of your experience rather than aspirations.",challenge:"The primary edge is moving from personal realisation to universal realisation — from 'I am doing well' to 'we are all one.' This requires releasing the last subtle forms of separation.",pattern:"The dominant pattern is expansive — your energy naturally uplifts those around you. The next step is deepening into states where the personal self begins to dissolve."},
    "Spiritual":{strength:"You operate from a state of being that transcends ordinary human experience. Your presence is a gift to all those around you.",challenge:"At these levels, the language of challenge no longer applies. There is only deepening into what already is.",pattern:"The dominant pattern is radiance — you do not act so much as allow action to move through you."},
  };
  return reports[lvl.mode]||reports["Victim/Abuser"];
}
let current=8;
const chartH=340;
const logMin=Math.log10(20),logMax=Math.log10(1000);
function barH(log){return Math.round(((Math.log10(log)-logMin)/(logMax-logMin))*chartH*0.88+chartH*0.07);}
const barsEl=document.getElementById('barsEl');
const barEls=[];
levels.forEach((d,i)=>{
  const col=document.createElement('div');col.className='bar-col';
  const bar=document.createElement('div');bar.className='bar';
  bar.style.height=barH(d.log)+'px';bar.style.background=modeColors[d.mode].bright;
  const lbl=document.createElement('span');lbl.className='bar-log';lbl.textContent=d.log;
  col.appendChild(bar);col.appendChild(lbl);
  col.addEventListener('click',()=>setLevel(i));
  barsEl.appendChild(col);barEls.push({col,bar,h:barH(d.log)});
});
const cursorLine=document.getElementById('cursorLine');
const cursorLabel=document.getElementById('cursorLabel');
const chartWrap=document.getElementById('chartWrap');
function cursorTop(i){const pt=28,pb=36;const avail=chartWrap.offsetHeight-pt-pb;return pt+(avail*(1-barEls[i].h/chartH));}
function setLevel(i){
  current=Math.max(0,Math.min(levels.length-1,i));
  const d=levels[current];const mc=modeColors[d.mode];
  cursorLine.style.top=cursorTop(current)+'px';
  cursorLabel.textContent=d.log+' · '+d.level;
  barEls.forEach((b,j)=>{b.col.classList.toggle('active',j===current);b.bar.style.background=modeColors[levels[j].mode].bright;});
  document.getElementById('dLog').textContent=d.log;
  document.getElementById('dLevel').textContent=d.level;
  const modeEl=document.getElementById('dMode');
  modeEl.textContent=d.mode;
  modeEl.setAttribute('style',mc.badge+';font-size:11px;padding:4px 12px;border-radius:20px;letter-spacing:0.05em;text-transform:uppercase;font-family:"DM Mono",monospace;margin-left:auto');
  document.getElementById('dDrive').textContent='"'+d.drive+'"';
  document.getElementById('happFill').style.width=d.happiness+'%';
  document.getElementById('happFill').style.background=mc.hap;
  document.getElementById('happPct').textContent=d.happiness+'%';
  document.getElementById('attrsGrid').innerHTML=[{k:'Emotion',v:d.emotion},{k:'Life-view',v:d.lifeView},{k:'God-view',v:d.godView},{k:'Process',v:d.process},{k:'Population',v:d.pop},{k:'Mode',v:d.mode}].map(x=>'<div class="attr-cell"><span class="attr-key">'+x.k+'</span><span class="attr-val">'+x.v+'</span></div>').join('');
  document.getElementById('navCount').textContent=(current+1)+' / '+levels.length;
}
function move(dir){setLevel(current+dir);}
document.addEventListener('keydown',e=>{if(document.getElementById('panel-chart').classList.contains('visible')){if(e.key==='ArrowRight'||e.key==='ArrowUp')move(1);if(e.key==='ArrowLeft'||e.key==='ArrowDown')move(-1);}});
window.addEventListener('resize',()=>{cursorLine.style.top=cursorTop(current)+'px';});
setLevel(current);
const questions=[
  {text:"When things go wrong in your life, your first instinct is…",opts:[{text:"It's my fault — I'm the problem",score:20},{text:"I feel crushed and can't move on",score:75},{text:"I get angry and want to blame someone",score:150},{text:"I feel anxious but try to manage it",score:100},{text:"I accept it and look for what I can do",score:350},{text:"I trust that things will work out",score:250}]},
  {text:"How do you generally feel about other people?",opts:[{text:"Most people are out to get me",score:100},{text:"People disappoint me constantly",score:125},{text:"I have to be better than others to matter",score:175},{text:"People are basically good and capable",score:350},{text:"I love people and want to help them grow",score:500},{text:"We are all connected at a deeper level",score:540}]},
  {text:"When you wake up in the morning, you mostly feel…",opts:[{text:"Dread — another hard day ahead",score:50},{text:"Anxious about what could go wrong",score:100},{text:"Fine — nothing special either way",score:250},{text:"Optimistic and ready to take on the day",score:310},{text:"Grateful and at peace",score:540},{text:"A quiet, deep sense of joy",score:600}]},
  {text:"How do you handle someone who disagrees with you?",opts:[{text:"I feel humiliated and shut down",score:20},{text:"I get irritated and want to prove them wrong",score:150},{text:"I feel hurt but keep it inside",score:75},{text:"I listen and try to understand their view",score:400},{text:"I welcome it — different perspectives help me grow",score:350},{text:"I feel compassion — we all see things differently",score:500}]},
  {text:"What motivates you most in life?",opts:[{text:"Getting what I want before others do",score:125},{text:"Proving I am better than those around me",score:175},{text:"Surviving and staying safe",score:100},{text:"Learning, growing, and improving myself",score:400},{text:"Making the world a better place",score:500},{text:"Experiencing the joy of being alive",score:540}]},
  {text:"How do you feel about your past mistakes?",opts:[{text:"I am deeply ashamed — I am a bad person",score:20},{text:"I feel guilty and keep punishing myself",score:30},{text:"I regret them and feel sad",score:75},{text:"I've accepted them and moved forward",score:350},{text:"They taught me valuable lessons",score:400},{text:"They shaped me into who I am — I'm at peace",score:540}]},
  {text:"When you see someone suffering, you feel…",opts:[{text:"Indifferent — it's not my problem",score:175},{text:"Uncomfortable and want to avoid it",score:50},{text:"Sad but unsure what to do",score:75},{text:"A genuine desire to help if I can",score:310},{text:"Deep empathy and love for them",score:500},{text:"Oneness — their pain is my pain",score:540}]},
  {text:"How do you feel about uncertainty and the unknown?",opts:[{text:"It terrifies me",score:100},{text:"It frustrates and angers me",score:150},{text:"I try to control everything to avoid it",score:175},{text:"I accept it as part of life",score:350},{text:"I embrace it — life is an adventure",score:310},{text:"I am at peace with not knowing",score:600}]},
  {text:"How would you describe your relationship with yourself?",opts:[{text:"I hate myself or feel worthless",score:20},{text:"I'm hard on myself — never good enough",score:30},{text:"I'm okay but wish I were different",score:125},{text:"I respect myself and my journey",score:250},{text:"I love and accept myself fully",score:500},{text:"I see myself as part of something greater",score:600}]},
  {text:"What best describes your outlook on the future?",opts:[{text:"There's no point — nothing will change",score:50},{text:"I'm worried about what's coming",score:100},{text:"I'll manage whatever comes my way",score:200},{text:"The future is full of possibilities",score:310},{text:"I am excited to keep evolving",score:400},{text:"All is well — now and always",score:600}]},
  {text:"How do you typically respond to criticism?",opts:[{text:"I collapse and feel worthless",score:20},{text:"I feel deeply hurt and withdraw",score:75},{text:"I get defensive and push back hard",score:150},{text:"I feel stung but reflect on it later",score:200},{text:"I consider it openly and take what's useful",score:400},{text:"I welcome it as a gift for my growth",score:350}]},
  {text:"How connected do you feel to other people in general?",opts:[{text:"Completely alone — no one understands me",score:50},{text:"I keep people at a distance to stay safe",score:100},{text:"I connect but always feel slightly separate",score:250},{text:"I have meaningful connections and feel part of a community",score:350},{text:"I feel a deep bond with most people I meet",score:500},{text:"I feel a sense of oneness with all beings",score:540}]},
  {text:"When you achieve something, you typically feel…",opts:[{text:"Nothing — it doesn't matter anyway",score:50},{text:"Relief that I didn't fail",score:100},{text:"Pride and superiority over others",score:175},{text:"Satisfied and quietly confident",score:250},{text:"Grateful and eager to share my success",score:400},{text:"Joyful — and happy for everyone who helped",score:500}]},
  {text:"How do you relate to money and material things?",opts:[{text:"I feel I never have enough and fear losing what I have",score:125},{text:"I resent people who have more than me",score:150},{text:"I work hard to be better off than others",score:175},{text:"Money is a tool — I use it and don't stress about it",score:250},{text:"I feel abundant and enjoy sharing what I have",score:400},{text:"I trust that my needs are always met",score:500}]},
  {text:"How do you handle a major personal failure?",opts:[{text:"I want to disappear or give up entirely",score:20},{text:"I punish myself for weeks or months",score:30},{text:"I get angry at myself or others",score:150},{text:"I feel bad but pick myself up and continue",score:200},{text:"I analyse what went wrong and adjust my approach",score:400},{text:"I accept it as part of the journey and move forward with peace",score:540}]},
  {text:"What is your relationship with forgiveness?",opts:[{text:"I cannot forgive — the hurt is too deep",score:75},{text:"I forgive eventually but never forget",score:150},{text:"I say I forgive but still carry resentment",score:175},{text:"I forgive when I understand the other person's perspective",score:350},{text:"Forgiveness comes naturally — holding grudges feels pointless",score:500},{text:"I see nothing to forgive — everyone is doing their best",score:540}]},
  {text:"How do you feel when someone else succeeds?",opts:[{text:"Invisible — like my own failure is highlighted",score:75},{text:"Envious and quietly resentful",score:125},{text:"Competitive — I need to do better than them",score:175},{text:"Happy for them but focused on my own path",score:310},{text:"Genuinely inspired and happy for them",score:400},{text:"Joyful — their success feels like mine too",score:540}]},
  {text:"What is your typical inner narrative during a hard day?",opts:[{text:"'Why does this always happen to me?'",score:75},{text:"'Everything is against me'",score:100},{text:"'I have to fight to get through this'",score:150},{text:"'This is hard but I can handle it'",score:200},{text:"'What can I learn from this?'",score:400},{text:"'This too shall pass — all is well'",score:540}]},
  {text:"How do you feel about the idea of death?",opts:[{text:"Terrified — I try not to think about it",score:100},{text:"Sad and anxious when it crosses my mind",score:75},{text:"I accept it intellectually but it still unsettles me",score:250},{text:"I've made peace with it as part of life",score:350},{text:"I see it as a transition, not an ending",score:500},{text:"There is no death — only transformation of consciousness",score:600}]},
  {text:"When you help others, what is usually driving you?",opts:[{text:"Fear of what they'll think if I don't",score:100},{text:"Guilt — I feel I have to",score:30},{text:"It makes me feel needed and important",score:175},{text:"It feels good and I genuinely want to contribute",score:310},{text:"Love — I care about their wellbeing as much as my own",score:500},{text:"There is no 'I' helping — service just flows through me",score:600}]},
];
function closestLevel(score){return levels.reduce((a,b)=>Math.abs(b.log-score)<Math.abs(a.log-score)?b:a);}
let qCurrent=0,qAnswers=[],qSelected=null;
const TOTAL=questions.length;
function renderQuiz(){
  const pct=Math.round((qCurrent/TOTAL)*100);
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progLbl').textContent=qCurrent+' / '+TOTAL;
  if(qCurrent>=TOTAL){showQuizResult();return;}
  const q=questions[qCurrent];
  qSelected=null;
  document.getElementById('qArea').innerHTML=
    '<div class="q-card"><div class="q-text">Q'+(qCurrent+1)+' of '+TOTAL+'. '+q.text+'</div><div class="opts" id="opts">'+q.opts.map((o,i)=>'<button class="opt" onclick="qPick('+i+')">'+o.text+'</button>').join('')+'</div></div>'+
    '<div class="qnav-row">'+(qCurrent>0?'<button class="qbtn" onclick="qBack()">Back</button>':'')+'<button class="qbtn primary" id="qNext" onclick="qNext()" disabled>Next</button></div>';
  if(qAnswers[qCurrent]!==undefined)qPick(qAnswers[qCurrent],true);
}
function qPick(i,restore){qSelected=i;document.querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('selected',j===i));document.getElementById('qNext').disabled=false;if(!restore)qAnswers[qCurrent]=i;}
function qNext(){if(qSelected===null)return;qAnswers[qCurrent]=qSelected;qCurrent++;renderQuiz();}
function qBack(){if(qCurrent>0){qCurrent--;renderQuiz();}}
function showQuizResult(){
  document.getElementById('progFill').style.width='100%';
  document.getElementById('progLbl').textContent=TOTAL+' / '+TOTAL;
  const total=qAnswers.reduce((s,ai,qi)=>s+questions[qi].opts[ai].score,0);
  const avg=Math.round(total/TOTAL);
  const lvl=closestLevel(avg);
  const mc=modeColors[lvl.mode];
  const report=getReport(lvl);
  const sugs=getSuggestions(lvl);
  const idx=levels.findIndex(l=>l.log===lvl.log);
  const nextLvl=idx<levels.length-1?levels[idx+1]:null;
  let nextBanner='';
  if(nextLvl){const nmc=modeColors[nextLvl.mode];nextBanner='<div class="section-title">Your next level</div><div class="next-level-banner" style="'+nmc.banner+'"><div class="nl-log">'+nextLvl.log+'</div><div class="nl-body"><div class="nl-label">Next milestone</div><div class="nl-level">'+nextLvl.level+'</div><div class="nl-desc">Emotion: '+nextLvl.emotion+' &nbsp;·&nbsp; '+nextLvl.happiness+'% happiness rate</div></div></div>';}
  const sugHtml=sugs.map((s,i)=>'<div class="sug-item"><div class="sug-num">'+(i+1)+'</div><div class="sug-body"><div class="sug-title">'+s.t+'</div><div class="sug-desc">'+s.d+'</div></div></div>').join('');
  document.getElementById('qArea').innerHTML=
    '<div class="result-card">'+
    '<div class="res-top"><span class="res-log">'+lvl.log+'</span><span class="res-level">'+lvl.level+'</span><span class="res-badge" style="'+mc.badge+'">'+lvl.mode+'</span></div>'+
    '<div class="res-drive">"'+lvl.drive+'"</div>'+
    '<div class="hbar-row"><span class="hbar-lbl">Happiness</span><div class="hbar-track"><div class="hbar-fill" style="width:'+lvl.happiness+'%;background:'+mc.hap+'"></div></div><span class="hbar-pct">'+lvl.happiness+'%</span></div>'+
    '<div class="res-attrs">'+[{k:'Emotion',v:lvl.emotion},{k:'Life-view',v:lvl.lifeView},{k:'God-view',v:lvl.godView},{k:'Process',v:lvl.process},{k:'Population',v:lvl.pop},{k:'Your score',v:avg}].map(x=>'<div class="res-attr"><span class="res-k">'+x.k+'</span><span class="res-v">'+x.v+'</span></div>').join('')+'</div>'+
    '<div><div class="section-title">Assessment report</div><div class="report-block"><div class="report-row"><div class="report-icon" style="background:rgba(127,119,221,0.2);color:#b3b0ff">+</div><div><div class="report-label">Strength</div><div class="report-text">'+report.strength+'</div></div></div><div class="report-row"><div class="report-icon" style="background:rgba(196,125,26,0.2);color:#ffcc80">!</div><div><div class="report-label">Challenge</div><div class="report-text">'+report.challenge+'</div></div></div><div class="report-row"><div class="report-icon" style="background:rgba(26,158,117,0.2);color:#80cbc4">~</div><div><div class="report-label">Pattern</div><div class="report-text">'+report.pattern+'</div></div></div></div></div>'+
    (nextBanner?'<div>'+nextBanner+'</div>':'')+
    '<div><div class="section-title">Suggestions to improve your level</div><div class="suggestion-list">'+sugHtml+'</div></div>'+
    '<div class="res-btns"><button class="qbtn" onclick="qRestart()">Retake quiz</button><button class="qbtn primary" onclick="showTab(\'chart\')">View on chart</button></div>'+
    '</div>';
  const cidx=levels.findIndex(l=>l.log===lvl.log);
  if(cidx>=0)setLevel(cidx);
}
function qRestart(){qCurrent=0;qAnswers=[];qSelected=null;renderQuiz();}
function showTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['chart','quiz'][i]===tab));
  document.getElementById('panel-chart').classList.toggle('visible',tab==='chart');
  document.getElementById('panel-quiz').classList.toggle('visible',tab==='quiz');
  if(tab==='quiz')renderQuiz();
  if(tab==='chart')cursorLine.style.top=cursorTop(current)+'px';
}
</script>
