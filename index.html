<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map of Consciousness</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--surface:#12121a;--border:rgba(255,255,255,0.07);--text:#e8e6f0;--muted:rgba(232,230,240,0.45);--victim:#c0392b;--empower:#c47d1a;--realize:#1a9e75;--spirit:#7f77dd;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px 80px;}
  header{text-align:center;margin-bottom:32px;}
  header h1{font-family:'DM Serif Display',serif;font-size:clamp(26px,5vw,44px);font-weight:400;color:var(--text);}
  header p{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:0.08em;text-transform:uppercase;}
  .tabs{display:flex;gap:4px;background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:4px;margin-bottom:28px;}
  .tab{padding:8px 28px;font-family:'DM Mono',monospace;font-size:13px;border-radius:9px;border:none;cursor:pointer;background:transparent;color:var(--muted);transition:all 0.2s;letter-spacing:0.04em;}
  .tab.active{background:rgba(127,119,221,0.18);color:#b3b0ff;}
  .main{width:100%;max-width:860px;}
  .panel{display:none;flex-direction:column;gap:24px;}
  .panel.visible{display:flex;}
  .legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-bottom:8px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);letter-spacing:0.05em;text-transform:uppercase;}
  .legend-dot{width:10px;height:10px;border-radius:50%;}
  .chart-wrap{position:relative;background:var(--surface);border:0.5px solid var(--border);border-radius:16px;padding:28px 20px 36px;overflow:hidden;}
  .bars{position:relative;height:340px;display:flex;align-items:flex-end;gap:4px;z-index:2;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;position:relative;height:100%;}
  .bar{width:100%;border-radius:4px 4px 0 0;transition:all 0.25s ease;opacity:0.35;}
  .bar-col.active .bar{opacity:1;}
  .bar-col:hover .bar{opacity:0.75;}
  .bar-log{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted);white-space:nowrap;}
  .cursor-line{position:absolute;left:20px;right:20px;height:1.5px;z-index:5;pointer-events:none;transition:top 0.3s cubic-bezier(0.4,0,0.2,1);}
  .cursor-line::before{content:'';position:absolute;left:0;right:0;height:100%;background:white;opacity:0.9;}
  .cursor-label{position:absolute;right:0;top:-18px;font-size:10px;color:white;background:var(--surface);padding:2px 6px;border-radius:4px;border:0.5px solid rgba(255,255,255,0.2);white-space:nowrap;}
  .cursor-tri{position:absolute;left:-8px;top:-4px;width:0;height:0;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;border-right:8px solid white;}
  .detail-card{background:var(--surface);border:0.5px solid var(--border);border-radius:16px;padding:24px 28px;}
  .detail-top{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;flex-wrap:wrap;}
  .detail-log{font-family:'DM Serif Display',serif;font-size:52px;line-height:1;font-style:italic;}
  .detail-level{font-family:'DM Serif Display',serif;font-size:28px;}
  .detail-mode{font-size:11px;padding:4px 12px;border-radius:20px;letter-spacing:0.05em;text-transform:uppercase;margin-left:auto;}
  .drive-quote{font-size:13px;color:var(--muted);font-style:italic;font-family:'DM Serif Display',serif;margin-bottom:20px;padding-left:12px;border-left:2px solid var(--border);}
  .hbar-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
  .hbar-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;min-width:76px;}
  .hbar-track{flex:1;height:4px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;}
  .hbar-fill{height:100%;border-radius:2px;transition:width 0.4s ease;}
  .hbar-pct{font-size:12px;min-width:34px;text-align:right;}
  .attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 20px;}
  .attr-cell{display:flex;flex-direction:column;gap:3px;}
  .attr-key{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;}
  .attr-val{font-size:13px;}
  .nav{display:flex;align-items:center;gap:12px;justify-content:center;}
  .nav-btn{background:var(--surface);border:0.5px solid rgba(255,255,255,0.12);color:var(--text);font-family:'DM Mono',monospace;font-size:12px;padding:8px 20px;border-radius:8px;cursor:pointer;transition:background 0.15s;}
  .nav-btn:hover{background:rgba(255,255,255,0.06);}
  .nav-count{font-size:11px;color:var(--muted);min-width:52px;text-align:center;}
  .key-hint{font-size:10px;color:var(--muted);text-align:center;letter-spacing:0.05em;text-transform:uppercase;}
  .quiz-wrap{display:flex;flex-direction:column;gap:16px;}
  .prog-row{display:flex;align-items:center;gap:10px;}
  .prog-track{flex:1;height:4px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;}
  .prog-fill{height:100%;background:#7f77dd;border-radius:2px;transition:width 0.3s ease;}
  .prog-lbl{font-size:12px;color:var(--muted);min-width:40px;text-align:right;}
  .q-card{background:var(--surface);border:0.5px solid var(--border);border-radius:16px;padding:20px 20px 16px;}
  .q-text{font-size:15px;font-weight:500;margin-bottom:16px;line-height:1.5;}
  .opts{display:flex;flex-direction:column;gap:8px;}
  .opt{padding:11px 14px;border:0.5px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);cursor:pointer;transition:background 0.12s,border-color 0.12s;text-align:left;background:transparent;font-family:'DM Mono',monospace;}
  .opt:hover{background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.15);}
  .opt.selected{background:rgba(127,119,221,0.15);border-color:#7f77dd;color:#b3b0ff;}
  .qnav-row{display:flex;gap:10px;justify-content:flex-end;}
  .qbtn{padding:8px 20px;font-size:13px;font-family:'DM Mono',monospace;border:0.5px solid rgba(255,255,255,0.15);border-radius:8px;background:transparent;color:var(--text);cursor:pointer;transition:background 0.15s;}
  .qbtn:hover{background:rgba(255,255,255,0.06);}
  .qbtn:disabled{opacity:0.3;cursor:default;}
  .qbtn.primary{background:#7f77dd;border-color:#7f77dd;color:#fff;}
  .qbtn.primary:hover{background:#534ab7;}
  .qbtn.whatsapp{background:#25D366;border-color:#25D366;color:#fff;display:flex;align-items:center;gap:8px;}
  .qbtn.whatsapp:hover{background:#1da851;}
  .result-card{background:var(--surface);border:0.5px solid var(--border);border-radius:16px;padding:28px 24px 24px;display:flex;flex-direction:column;gap:20px;}
  .res-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .res-log{font-family:'DM Serif Display',serif;font-size:52px;line-height:1;font-style:italic;}
  .res-level{font-family:'DM Serif Display',serif;font-size:26px;}
  .res-badge{font-size:11px;padding:4px 12px;border-radius:20px;letter-spacing:0.05em;text-transform:uppercase;margin-left:auto;}
  .res-drive{font-size:13px;color:var(--muted);font-style:italic;font-family:'DM Serif Display',serif;padding-left:12px;border-left:2px solid var(--border);}
  .res-attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px;}
  .res-attr{display:flex;flex-direction:column;gap:2px;}
  .res-k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;}
  .res-v{font-size:13px;}
  .section-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;}
  .report-block{background:rgba(255,255,255,0.03);border:0.5px solid var(--border);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;}
  .report-row{display:flex;align-items:flex-start;gap:12px;}
  .report-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:1px;}
  .report-text{font-size:13px;line-height:1.6;color:var(--text);}
  .report-label{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:2px;}
  .sug-tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap;}
  .sug-tab{padding:5px 14px;font-size:11px;font-family:'DM Mono',monospace;border-radius:6px;border:0.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;letter-spacing:0.04em;transition:all 0.15s;}
  .sug-tab.active{background:rgba(127,119,221,0.15);border-color:#7f77dd;color:#b3b0ff;}
  .suggestion-list{display:flex;flex-direction:column;gap:10px;}
  .sug-item{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,0.03);border:0.5px solid var(--border);border-radius:10px;padding:14px 16px;}
  .sug-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;margin-top:1px;background:rgba(255,255,255,0.05);}
  .sug-body{flex:1;}
  .sug-title{font-size:13px;font-weight:500;margin-bottom:4px;}
  .sug-desc{font-size:12px;color:var(--muted);line-height:1.6;}
  .breath-steps{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .breath-step{background:rgba(127,119,221,0.12);border:0.5px solid rgba(127,119,221,0.3);border-radius:6px;padding:4px 10px;font-size:11px;color:#b3b0ff;}
  .routine-time{display:inline-block;background:rgba(26,158,117,0.12);border:0.5px solid rgba(26,158,117,0.3);border-radius:6px;padding:3px 8px;font-size:10px;color:#80cbc4;margin-bottom:6px;letter-spacing:0.04em;}
  .next-level-banner{border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:16px;}
  .nl-log{font-family:'DM Serif Display',serif;font-size:36px;font-style:italic;line-height:1;}
  .nl-body{flex:1;}
  .nl-label{font-size:10px;text-transform:uppercase;letter-spacing:0.07em;opacity:0.7;margin-bottom:4px;}
  .nl-level{font-size:18px;font-weight:500;}
  .nl-desc{font-size:12px;opacity:0.75;margin-top:3px;line-height:1.5;}
  .share-card{border-radius:16px;padding:24px 20px 20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;}
  .share-card-tag{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;opacity:0.6;font-family:'DM Mono',monospace;}
  .share-card-main{display:flex;align-items:flex-end;gap:14px;}
  .share-card-log{font-family:'DM Serif Display',serif;font-size:64px;line-height:1;font-style:italic;}
  .share-card-right{display:flex;flex-direction:column;gap:3px;padding-bottom:6px;}
  .share-card-level{font-family:'DM Serif Display',serif;font-size:22px;}
  .share-card-mode{font-size:11px;letter-spacing:0.06em;text-transform:uppercase;opacity:0.7;}
  .share-card-drive{font-size:13px;font-style:italic;opacity:0.8;font-family:'DM Serif Display',serif;padding-left:12px;border-left:2px solid rgba(255,255,255,0.25);line-height:1.5;}
  .share-card-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .sc-stat{background:rgba(255,255,255,0.1);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:2px;}
  .sc-stat-k{font-size:10px;letter-spacing:0.06em;text-transform:uppercase;opacity:0.6;}
  .sc-stat-v{font-size:12px;font-weight:500;}
  .share-card-hap{display:flex;align-items:center;gap:10px;}
  .sc-hap-track{flex:1;height:3px;background:rgba(255,255,255,0.2);border-radius:2px;overflow:hidden;}
  .sc-hap-fill{height:100%;background:rgba(255,255,255,0.85);border-radius:2px;}
  .sc-hap-pct{font-size:11px;opacity:0.75;min-width:28px;}
  .share-card-footer{font-size:10px;opacity:0.4;letter-spacing:0.05em;text-transform:uppercase;}
  .share-btns{display:flex;gap:10px;flex-wrap:wrap;}
  .res-btns{display:flex;gap:10px;flex-wrap:wrap;}
  @media(max-width:560px){.attrs,.res-attrs{grid-template-columns:repeat(2,1fr);}.detail-log,.res-log{font-size:36px;}.detail-level,.res-level{font-size:20px;}.share-card-stats{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>
<header>
  <h1>Map of Consciousness</h1>
  <p>Dr. David R. Hawkins · Scale of Human Awareness</p>
</header>
<div class="tabs">
  <button class="tab active" onclick="showTab('chart')">Chart</button>
  <button class="tab" onclick="showTab('quiz')">Self-Assessment Quiz</button>
</div>
<div class="main">
  <div class="panel visible" id="panel-chart">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--victim)"></div>Victim / Abuser</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--empower)"></div>Self-Empowerment</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--realize)"></div>Self-Realization</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--spirit)"></div>Spiritual</div>
    </div>
    <div class="chart-wrap" id="chartWrap">
      <div class="cursor-line" id="cursorLine"><div class="cursor-tri"></div><div class="cursor-label" id="cursorLabel">200 · Courage</div></div>
      <div class="bars" id="barsEl"></div>
    </div>
    <div class="detail-card" id="detailCard">
      <div class="detail-top">
        <span class="detail-log" id="dLog">200</span>
        <span class="detail-level" id="dLevel">Courage</span>
        <span class="detail-mode" id="dMode"></span>
      </div>
      <div class="drive-quote" id="dDrive"></div>
      <div class="hbar-row">
        <span class="hbar-lbl">Happiness</span>
        <div class="hbar-track"><div class="hbar-fill" id="happFill"></div></div>
        <span class="hbar-pct" id="happPct"></span>
      </div>
      <div class="attrs" id="attrsGrid"></div>
    </div>
    <div class="nav">
      <button class="nav-btn" onclick="move(-1)">← prev</button>
      <span class="nav-count" id="navCount">9 / 17</span>
      <button class="nav-btn" onclick="move(1)">next →</button>
    </div>
    <div class="key-hint">or use ← → arrow keys</div>
  </div>
  <div class="panel" id="panel-quiz">
    <div class="quiz-wrap">
      <div class="prog-row">
        <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
        <span class="prog-lbl" id="progLbl">0 / 20</span>
      </div>
      <div id="qArea"></div>
    </div>
  </div>
</div>
<script>

  {log:30,level:"Guilt",lifeView:"Evil",emotion:"Blame",godView:"Vindictive",process:"Destruction",drive:"No one needs to survive",happiness:4,pop:"78%",mode:"Victim/Abuser",bg:"#2d0a0a",accent:"#ff8a80"},

  {log:75,level:"Grief",lifeView:"Tragic",emotion:"Regret",godView:"Disdainful",process:"Despondency",drive:"You don't survive so I don't",happiness:9,pop:"78%",mode:"Victim/Abuser",bg:"#1a0a0a",accent:"#ff8a80"},
  {log:100,level:"Fear",lifeView:"Frightening",emotion:"Anxiety",godView:"Punitive",process:"Withdrawal",drive:"I only survive if you don't",happiness:10,pop:"78%",mode:"Victim/Abuser",bg:"#2d1a0a",accent:"#ffcc80"},
  {log:125,level:"Desire",lifeView:"Disappointing",emotion:"Craving",godView:"Denying",process:"Enslavement",drive:"I only survive if others give me what I want",happiness:10,pop:"78%",mode:"Victim/Abuser",bg:"#2d1a0a",accent:"#ffcc80"},

  {log:500,level:"Love",lifeView:"Benign",emotion:"Reverence",godView:"Loving",process:"Revelation",drive:"We can all share in happiness",happiness:89,pop:"3.99%",mode:"Self-Realization",bg:"#1a0a3d",accent:"#b3b0ff"},
  {log:540,level:"Joy",lifeView:"Complete",emotion:"Serenity",godView:"One",process:"Transfiguration",drive:"Your joy is my joy",happiness:96,pop:"0.40%",mode:"Self-Realization",bg:"#2a0a4d",accent:"#e1bee7"},
  {log:600,level:"Peace",lifeView:"Perfect",emotion:"Bliss",godView:"All-Being",process:"Illumination",drive:"Good of mankind",happiness:100,pop:"722 persons",mode:"Spiritual",bg:"#0a0a2d",accent:"#e8eaf6"},
  {log:1000,level:"Enlightenment",lifeView:"Is",emotion:"Ineffable",godView:"Self",process:"Pure-Consciousness",drive:"Salvation of humanity",happiness:100,pop:"722 persons",mode:"Spiritual",bg:"#050510",accent:"#ede7f6"},

  "Victim/Abuser":{bright:"#c0392b",badge:"background:#4a1515;color:#ff8a80",hap:"#c0392b",banner:"background:rgba(192,57,43,0.12);color:#ff8a80"},
  "Self-Empowerment":{bright:"#c47d1a",badge:"background:#4a2e08;color:#ffcc80",hap:"#c47d1a",banner:"background:rgba(196,125,26,0.12);color:#ffcc80"},
  "Self-Realization":{bright:"#1a9e75",badge:"background:#083d2c;color:#80cbc4",hap:"#1a9e75",banner:"background:rgba(26,158,117,0.12);color:#80cbc4"},
  "Spiritual":{bright:"#7f77dd",badge:"background:#2a2660;color:#b3b0ff",hap:"#7f77dd",banner:"background:rgba(127,119,221,0.12);color:#b3b0ff"},
};

const allSuggestions={
  "Victim/Abuser":{
    20:{general:[{icon:"🌱",t:"Practice self-compassion daily",d:"Write one kind sentence to yourself each morning. Shame dissolves through self-forgiveness, not self-punishment."},{icon:"🤝",t:"Seek professional support",d:"A therapist provides a safe space to process deep shame. You don't have to carry this alone."},{icon:"🕯️",t:"Find one reason to stay present",d:"Identify a single person, pet, or purpose that gives you a reason to engage with today."},{icon:"📖",t:"Read stories of recovery",d:"Others have healed from shame. Brené Brown's work on shame resilience is a powerful starting point."}],breathing:[{icon:"🌬️",t:"Extended Exhale Breath (5-7)",d:"Inhale for 5 counts, exhale slowly for 7. The longer exhale signals safety to the body.",steps:["Inhale: 1-2-3-4-5","Exhale slowly: 1-2-3-4-5-6-7","Repeat 6 times","Use whenever shame arises"]},{icon:"💨",t:"Hand-on-Heart Breathing",d:"Place one hand on your heart. Breathe in warmth, breathe out tension.",steps:["Place hand on heart","Breathe in: feel warmth","Breathe out: release tightness","Whisper 'I am enough' on each exhale"]}],routine:[{icon:"☀️",t:"Morning: 2-min self-compassion ritual",d:"On waking, place hand on heart and say: 'I am here. I am trying. That is enough.' Then take 5 slow breaths.",time:"Morning · 2 min"},{icon:"🌙",t:"Evening: One kind thing journal",d:"Each night write one thing you did today that took any effort at all — no matter how small.",time:"Evening · 3 min"},{icon:"🚶",t:"Daily: 10-min sunlight walk",d:"Step outside every day. Sunlight, movement, and nature are the simplest antidotes to shame's darkness.",time:"Any time · 10 min"}]},
    30:{general:[{icon:"🔍",t:"Distinguish guilt from shame",d:"Guilt says 'I did something bad.' Shame says 'I am bad.' Focus on the action, not your identity."},{icon:"✍️",t:"Start a forgiveness journal",d:"Each day write one thing you forgive yourself for — not to excuse it, but to stop the endless punishment."},{icon:"💬",t:"Talk to someone you trust",d:"Saying guilt out loud to a trusted person makes it smaller. Secrets give guilt its power."},{icon:"🔧",t:"Make one small amend",d:"A small step toward repair — even just acknowledging something internally — begins to release guilt."}],breathing:[{icon:"🌬️",t:"4-4-4-4 Box Breathing",d:"Equal counts of inhale, hold, exhale, hold. Brings the nervous system to neutral.",steps:["Inhale: 4 counts","Hold: 4 counts","Exhale: 4 counts","Hold: 4 counts","Repeat 5 rounds"]},{icon:"💨",t:"Sighing Release Breath",d:"A long audible sigh physiologically releases held tension and guilt energy.",steps:["Breathe in normally","Open mouth wide","Let out a long slow sigh","Feel the release","Repeat 3 times"]}],routine:[{icon:"☀️",t:"Morning: Intention setting",d:"Each morning choose one small action that aligns with who you want to be — not who you fear you are.",time:"Morning · 2 min"},{icon:"🌙",t:"Evening: Guilt audit",d:"Ask: 'Is this guilt pointing to something I can repair, or is it just punishment?' If repair — plan one step.",time:"Evening · 5 min"},{icon:"🧘",t:"Midday: 5-min stillness",d:"Sit quietly, observe your thoughts without following them. This builds the gap between guilt and identity.",time:"Midday · 5 min"}]},
    50:{general:[{icon:"⚡",t:"Take one tiny action each day",d:"Apathy is broken by movement, not motivation. Do one tiny thing and let the feeling follow."},{icon:"🌿",t:"Connect with one living thing",d:"A plant, pet, or person that needs you. Responsibility is a powerful antidote to apathy."},{icon:"📺",t:"Reduce numbing behaviours",d:"Identify what you use to avoid feeling — screens, food, alcohol. Feeling something is better than nothing."},{icon:"🏔️",t:"Lower the bar radically",d:"Don't aim for happiness. Aim for slightly less hopeless. Small wins build momentum."}],breathing:[{icon:"🌬️",t:"Stimulating Bellows Breath",d:"Short, sharp inhales and exhales. Activates energy when everything feels flat.",steps:["Sit upright","Rapid inhale through nose (1 sec)","Rapid exhale through nose (1 sec)","Repeat 10 times","Breathe normally 30 sec","Do 3 rounds"]},{icon:"💨",t:"Energising Morning Breath",d:"Three deep breaths before getting out of bed. Signals to the body: 'Today begins.'",steps:["Still lying down: breathe in deeply","Exhale completely","Second breath: even deeper","Third breath: fill lungs fully","Now get up"]}],routine:[{icon:"☀️",t:"Morning: One physical action before phone",d:"Before any screen, do one physical thing — wash your face, drink water, step outside.",time:"Morning · 2 min"},{icon:"🌙",t:"Evening: Name one thing that existed today",d:"Not 'good things' — just things that existed. A colour. Food you ate. A sound you heard.",time:"Evening · 2 min"},{icon:"🚶",t:"Daily: 10-min walk, no phone",d:"Walk outside without any device. Movement, light, and silence are powerful antidotes to apathy.",time:"Any time · 10 min"}]},
    75:{general:[{icon:"🌊",t:"Allow grief to move through you",d:"Grief resisted stays stuck. Write about what you've lost. Let it be felt rather than pushed down."},{icon:"👥",t:"Join a support group",d:"Shared grief is lighter grief. Others who understand your loss help you feel less alone."},{icon:"🕯️",t:"Create a ritual of remembrance",d:"A small ritual — lighting a candle, visiting a place — honours loss without being consumed by it."},{icon:"🌱",t:"Look for what remains",d:"Gently ask: what is still here? What has not been lost? This is not denial — it's balance."}],breathing:[{icon:"🌬️",t:"Grief Release Breath",d:"Long inhale, then exhale with a soft 'haaa' sound. Opens the chest where grief is held.",steps:["Inhale deeply: 4 counts","Open mouth slightly","Exhale with soft 'haaaa' sound","Feel chest soften","Repeat 8 times"]},{icon:"💨",t:"Coherence Breathing (5-5)",d:"Inhale 5 counts, exhale 5 counts. Shown to reduce emotional pain and depression.",steps:["Inhale: 1-2-3-4-5","Exhale: 1-2-3-4-5","No holds — continuous flow","10 minutes for full effect","Use during waves of grief"]}],routine:[{icon:"☀️",t:"Morning: Acknowledge before you rise",d:"Place a hand on your chest and say: 'I am grieving. That is okay. I will move gently today.'",time:"Morning · 1 min"},{icon:"🌙",t:"Weekly: Write a letter to what you lost",d:"Write a short letter to the person or thing you are grieving. Not to fix it — just to express it.",time:"Weekly · 10 min"},{icon:"🧴",t:"Daily: Body care ritual",d:"One simple act of physical care — a warm shower, lotion, gentle stretching — says 'this body deserves care.'",time:"Daily · 5 min"}]},
    100:{general:[{icon:"🔍",t:"Name your fear precisely",d:"Vague fear is more powerful than named fear. Write exactly what you are afraid of."},{icon:"🧠",t:"Challenge catastrophic thinking",d:"Ask: what is the most realistic outcome, not the worst? Fear exaggerates. Reality is more manageable."},{icon:"🛡️",t:"Build a safety net",d:"Practical steps — savings, skills, relationships — reduce the legitimate basis for fear."},{icon:"🐾",t:"Take one small step toward the fear",d:"Avoidance grows fear. Approach shrinks it. Find the smallest possible step and take it today."}],breathing:[{icon:"🌬️",t:"4-7-8 Anti-Anxiety Breath",d:"Activates the vagus nerve and rapidly reduces the physiological fear response.",steps:["Inhale quietly: 4 counts","Hold breath: 7 counts","Exhale completely: 8 counts","Repeat 4 cycles","Do twice daily"]},{icon:"💨",t:"Physiological Sigh",d:"A double inhale through the nose followed by a long exhale. Fastest way to reduce acute stress.",steps:["Inhale through nose","At the top — sniff again to fill","Long slow exhale through mouth","Repeat 3 times","Instant calming effect"]}],routine:[{icon:"☀️",t:"Morning: Name today's fear + one action",d:"Write: 'Today I am afraid of ___.' Then write one small action you will take anyway.",time:"Morning · 3 min"},{icon:"🌙",t:"Evening: Fear vs Reality check",d:"Write: 'I feared ___ would happen. What actually happened was ___.' Fear's predictions are usually wrong.",time:"Evening · 3 min"},{icon:"🧘",t:"Daily: 5-min body scan",d:"Notice where fear lives in your body. Breathe directly into that spot. The body relaxes when acknowledged.",time:"Any time · 5 min"}]},
    125:{general:[{icon:"⏸️",t:"Pause between urge and action",d:"Practice pausing before acting on any impulse. The pause builds freedom."},{icon:"🙏",t:"Gratitude for what you already have",d:"Write three things you already have that you once wanted. Desire says 'not enough.' Gratitude says 'enough.'"},{icon:"🎯",t:"Identify the real need beneath the want",d:"Is this desire meeting a real need — connection, security, respect — or filling a void?"},{icon:"📵",t:"Reduce advertising and media exposure",d:"Much of desire is manufactured. Reducing artificial wants is a form of mental hygiene."}],breathing:[{icon:"🌬️",t:"Counting Breath (craving interrupter)",d:"Count your breaths from 1 to 10. Interrupts the neurological craving loop.",steps:["Desire arises — don't act","Close eyes if possible","Breathe in: count '1'","Breathe out: count '2'","Continue to 10","Start again — urge usually passes"]},{icon:"💨",t:"Belly Breathing (satisfaction breath)",d:"Deep belly breathing reduces the feeling of lack and urgency that drives craving.",steps:["Place hand on belly","Breathe in — belly rises","Breathe out — belly falls","Slow: 4 in, 6 out","5 minutes to feel satisfied"]}],routine:[{icon:"☀️",t:"Morning: Set an intention of 'enough'",d:"Before checking your phone, say: 'Today I already have enough. I am enough.'",time:"Morning · 1 min"},{icon:"🌙",t:"Evening: Three things I enjoyed today",d:"Not things you acquired — experiences. A conversation. A taste. A moment.",time:"Evening · 3 min"},{icon:"⏱️",t:"Daily: 24-hour rule on purchases",d:"Before any non-essential purchase, wait 24 hours. Most cravings pass.",time:"Ongoing practice"}]},
    150:{general:[{icon:"❤️",t:"Find the hurt beneath the anger",d:"Anger almost always covers hurt, fear, or injustice. Ask: what am I really feeling underneath this?"},{icon:"🏋️",t:"Use physical outlets for anger energy",d:"Exercise, sport, or physical work channels anger healthily."},{icon:"⏸️",t:"Practice the pause",d:"Between trigger and response, create space. Even counting to ten changes the pattern of reactive anger."},{icon:"🕊️",t:"Forgiveness as a practice",d:"Forgiveness doesn't excuse others. It frees you from carrying their weight."}],breathing:[{icon:"🌬️",t:"Lion's Breath (anger release)",d:"Open mouth wide, stick out tongue, exhale forcefully with a 'haaa' sound. Releases suppressed anger.",steps:["Inhale deeply through nose","Open mouth wide, extend tongue","Exhale forcefully: 'HAAAA'","Eyes wide open during exhale","Repeat 5 times"]},{icon:"💨",t:"Cooling Breath (Sitali)",d:"Breathe through slightly parted teeth. The cooling sensation counteracts the heat of anger.",steps:["Part teeth slightly","Inhale through parted teeth — feel cool air","Close mouth","Exhale slowly through nose","Repeat 8 times"]}],routine:[{icon:"☀️",t:"Morning: Anger inventory",d:"Ask: 'Is there any unresolved anger I'm carrying today?' If yes, name it in writing.",time:"Morning · 2 min"},{icon:"🌙",t:"Evening: What was I really feeling?",d:"Review any anger from the day. Underneath it — was there fear? Hurt? Injustice?",time:"Evening · 4 min"},{icon:"🏃",t:"Daily: Physical movement 20+ min",d:"Anger is energy. Without a physical outlet it turns inward or explodes outward.",time:"Daily · 20 min"}]},
    175:{general:[{icon:"🔎",t:"Notice when pride becomes defence",d:"Ask: where am I using 'being better' to avoid feeling not enough?"},{icon:"👂",t:"Practice genuine curiosity",d:"Ask people questions and actually listen. Curiosity reveals that others have much to teach."},{icon:"🙋",t:"Acknowledge one mistake per day",d:"Acknowledging small mistakes builds the humility that opens the door to Courage."},{icon:"🎓",t:"Find a mentor or teacher",d:"Placing yourself in a learning position dismantles the need to be the best in the room."}],breathing:[{icon:"🌬️",t:"Humble Breath (slow nostril breathing)",d:"Slow nasal breathing reduces cortisol and the feeling of threat that keeps pride on guard.",steps:["Breathe only through nose","Slow breath to 5-6 per minute","Inhale: 5 counts","Exhale: 5 counts","10 minutes daily"]},{icon:"💨",t:"Equal Breathing with Pause",d:"Inhale 4, hold 2, exhale 4, hold 2. Creates balance and dissolves pride-based vigilance.",steps:["Inhale: 4 counts","Hold: 2 counts","Exhale: 4 counts","Hold: 2 counts","Repeat 10 cycles"]}],routine:[{icon:"☀️",t:"Morning: Ask 'what can I learn today?'",d:"Start each day with the question of a student rather than an expert.",time:"Morning · 1 min"},{icon:"🌙",t:"Evening: Who helped me today?",d:"Write every person whose contribution made your day possible. Gratitude dissolves pride.",time:"Evening · 3 min"},{icon:"🤲",t:"Weekly: Anonymous service",d:"Do one helpful act per week that no one will know you did. The ego gets nothing — that is the point.",time:"Weekly"}]}},
  "Self-Empowerment":{
    200:{general:[{icon:"🦁",t:"Expand your comfort zone weekly",d:"Each week do one thing that slightly scares you. Your threshold of what feels manageable expands over time."},{icon:"🤝",t:"Build self-trust through kept promises",d:"Make small commitments to yourself and keep them. Each kept promise builds internal credibility."},{icon:"📚",t:"Study what you fear",d:"Knowledge reduces fear. If you fear failure, study resilience. Understanding disarms threats."},{icon:"🔄",t:"Reframe failure as information",d:"Every failure tells you something useful. Begin treating it that way."}],breathing:[{icon:"🌬️",t:"Power Breath (Wim Hof light version)",d:"30 deep rhythmic breaths, then a natural hold. Builds tolerance for discomfort — the foundation of courage.",steps:["30 deep belly-to-chest inhales","Let exhale go naturally","After 30th: breathe out and hold","Hold comfortably","Inhale deeply, hold 15 sec","Do 3 rounds"]},{icon:"💨",t:"Victory Breath (before challenges)",d:"Deep inhale with arms spread wide, then exhale fully. Increases confidence hormones.",steps:["Stand tall","Spread arms slightly","Inhale deeply — chest expands","Hold 2 seconds at top","Exhale fully","Do 3 times before any challenge"]}],routine:[{icon:"☀️",t:"Morning: One courageous intention",d:"Each morning name one thing you will do today that requires courage — however small.",time:"Morning · 2 min"},{icon:"🌙",t:"Evening: Courage log",d:"Write one courageous act from today. Over weeks this journal becomes proof of who you are becoming.",time:"Evening · 3 min"},{icon:"🧊",t:"Daily: Cold water finish to shower",d:"End your shower with 30 seconds of cold water. Trains the nervous system to face discomfort with control.",time:"Daily · 30 sec"}]},
    250:{general:[{icon:"📋",t:"Build trust through evidence",d:"Review times in your past when things worked out even when you worried."},{icon:"🌊",t:"Reduce the need to control",d:"Practice letting small things unfold without intervention. Release attachment to specific results."},{icon:"✅",t:"Say yes to more opportunities",d:"Neutrality can become passive. Begin saying yes to experiences you would normally let pass."},{icon:"🎁",t:"Serve others without agenda",d:"Find one way per week to help without expectation of return."}],breathing:[{icon:"🌬️",t:"Natural Breath Awareness",d:"Simply observe your breath without controlling it. The breath practice of equanimity.",steps:["Sit comfortably","Close eyes","Do not control the breath","Simply observe: in... out...","When mind wanders — return","10-20 minutes daily"]},{icon:"💨",t:"4-6 Relaxation Breathing",d:"Inhale for 4, exhale for 6. Trains the body toward the ease and trust of Neutrality.",steps:["Inhale: 4 counts","Exhale slowly: 6 counts","No holds","Continuous gentle flow","10 minutes for full effect"]}],routine:[{icon:"☀️",t:"Morning: Trust affirmation",d:"Say: 'Today I trust the process. I don't need to control what I cannot control.' Then 5 slow breaths.",time:"Morning · 2 min"},{icon:"🌙",t:"Evening: Release list",d:"Write three things you were trying to control today that are not truly yours to control. Then: 'I release these.'",time:"Evening · 4 min"},{icon:"🌿",t:"Daily: 10 min in nature, no agenda",d:"Sit outside — park, garden, anywhere. Do nothing. Nature is the greatest teacher of Neutrality.",time:"Daily · 10 min"}]},
    310:{general:[{icon:"✅",t:"Say yes to growth opportunities",d:"Willingness thrives on momentum. Embrace courses, projects, and challenges that stretch you."},{icon:"🎯",t:"Convert hope into specific goals",d:"Willingness is hopeful but can stay passive. Convert hope into goals with dates and steps."},{icon:"🌱",t:"Invest in meaningful relationships",d:"At Willingness your positive energy attracts others. Deepen a few relationships."},{icon:"🙏",t:"Develop a reflective practice",d:"A practice — prayer, meditation, philosophy — accelerates the journey to Acceptance and beyond."}],breathing:[{icon:"🌬️",t:"Expansive Breathing",d:"Breathe into the upper chest — feel it expand forward and sideways. Creates expansive thinking.",steps:["Sit or stand tall","Breathe into upper chest first","Then expand sideways — ribs out","Hold gently for 3 counts","Exhale fully — soften","Repeat 8 times"]},{icon:"💨",t:"Alternate Nostril Breathing",d:"Balances both brain hemispheres and creates the calm clarity that supports optimistic action.",steps:["Right thumb closes right nostril","Inhale left: 4 counts","Close left with ring finger","Open right — exhale: 4 counts","Inhale right: 4 counts","Exhale left: 4 counts — one cycle"]}],routine:[{icon:"☀️",t:"Morning: Three things I'm looking forward to",d:"Name three things you are genuinely looking forward to today. Primes the brain toward optimism.",time:"Morning · 2 min"},{icon:"🌙",t:"Evening: Progress over perfection",d:"Write one way you made progress today — not achievement, just forward motion.",time:"Evening · 2 min"},{icon:"📚",t:"Daily: 15 min of learning",d:"Read, listen, or watch something that teaches you something new every day.",time:"Daily · 15 min"}]},
    350:{general:[{icon:"🕊️",t:"Forgive your past self",d:"Turn forgiveness inward — to who you were before you knew what you know now."},{icon:"🌊",t:"Practise non-resistance",d:"When difficult emotions arise, breathe and say 'I allow this.' Acceptance is a muscle."},{icon:"🎓",t:"Mentor someone earlier in their journey",d:"Teaching what you know consolidates and deepens it."},{icon:"🌿",t:"Spend time in nature",d:"Nature operates at perfect Acceptance. Time outdoors recalibrates the nervous system."}],breathing:[{icon:"🌬️",t:"Acceptance Breath",d:"Breathe in with intention of accepting everything. On exhale, release the need for things to be different.",steps:["Inhale: silently say 'I accept this'","Exhale: silently say 'I release resistance'","Breathe slowly","Let the words sink in","10 minutes changes your relationship with reality"]},{icon:"💨",t:"Three-Part Yogic Breath",d:"Fill belly first, then ribcage, then chest. The breath of wholeness.",steps:["Inhale — belly fills first","Continue — ribcage expands","Complete — chest rises","Exhale — chest softens","Ribcage releases","Belly draws gently in"]}],routine:[{icon:"☀️",t:"Morning: Acceptance statement",d:"Say: 'Today I accept what is. I respond with wisdom rather than react with resistance.'",time:"Morning · 2 min"},{icon:"🌙",t:"Evening: Forgiveness round",d:"Ask: 'Who or what am I still resisting?' Then: 'I choose to accept this — peace is worth more than the fight.'",time:"Evening · 5 min"},{icon:"🧘",t:"Daily: 10-min meditation on 'what is'",d:"Observe whatever arises — thoughts, sensations, emotions — and let them be. This is Acceptance.",time:"Daily · 10 min"}]},

  "Self-Realization":{

let current=8;
const chartH=340;
const logMin=Math.log10(20),logMax=Math.log10(1000);
function barH(log){return Math.round(((Math.log10(log)-logMin)/(logMax-logMin))*chartH*0.88+chartH*0.07);}
const barsEl=document.getElementById('barsEl');
const barEls=[];
levels.forEach((d,i)=>{
  const col=document.createElement('div');col.className='bar-col';
  const bar=document.createElement('div');bar.className='bar';
  bar.style.height=barH(d.log)+'px';bar.style.background=modeColors[d.mode].bright;
  const lbl=document.createElement('span');lbl.className='bar-log';lbl.textContent=d.log;
  col.appendChild(bar);col.appendChild(lbl);
  col.addEventListener('click',()=>setLevel(i));
  barsEl.appendChild(col);barEls.push({col,bar,h:barH(d.log)});
});
const cursorLine=document.getElementById('cursorLine');
const cursorLabel=document.getElementById('cursorLabel');
const chartWrap=document.getElementById('chartWrap');
function cursorTop(i){const pt=28,pb=36;const avail=chartWrap.offsetHeight-pt-pb;return pt+(avail*(1-barEls[i].h/chartH));}
function setLevel(i){
  current=Math.max(0,Math.min(levels.length-1,i));
  const d=levels[current];const mc=modeColors[d.mode];
  cursorLine.style.top=cursorTop(current)+'px';
  cursorLabel.textContent=d.log+' · '+d.level;

  document.getElementById('attrsGrid').innerHTML=[{k:'Emotion',v:d.emotion},{k:'Life-view',v:d.lifeView},{k:'God-view',v:d.godView},{k:'Process',v:d.process},{k:'Population',v:d.pop},{k:'Mode',v:d.mode}].map(x=>'<div class="attr-cell"><span class="attr-key">'+x.k+'</span><span class="attr-val">'+x.v+'</span></div>').join('');

}
function move(dir){setLevel(current+dir);}
