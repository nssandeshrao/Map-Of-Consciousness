<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map of Consciousness</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--surface:#12121a;--border:rgba(255,255,255,0.07);--text:#e8e6f0;--muted:rgba(232,230,240,0.45);--victim:#c0392b;--empower:#c47d1a;--realize:#1a9e75;--spirit:#7f77dd;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px 80px;}
  header{text-align:center;margin-bottom:32px;}
  header h1{font-family:'DM Serif Display',serif;font-size:clamp(26px,5vw,44px);font-weight:400;color:var(--text);}
  header p{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:0.08em;text-transform:uppercase;}
  .tabs{display:flex;gap:4px;background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:4px;margin-bottom:28px;}
  .tab{padding:8px 28px;font-family:'DM Mono',monospace;font-size:13px;border-radius:9px;border:none;cursor:pointer;background:transparent;color:var(--muted);transition:all 0.2s;letter-spacing:0.04em;}
  .tab.active{background:rgba(127,119,221,0.18);color:#b3b0ff;}
  .main{width:100%;max-width:860px;}
  .panel{display:none;flex-direction:column;gap:24px;}
  .panel.visible{display:flex;}
  .legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-bottom:8px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);letter-spacing:0.05em;text-transform:uppercase;}
  .legend-dot{width:10px;height:10px;border-radius:50%;}
  .chart-wrap{position:relative;background:var(--surface);border:0.5px solid var(--border);border-radius:16px;padding:28px 20px 36px;overflow:hidden;}
  .bars{position:relative;height:340px;display:flex;align-items:flex-end;gap:4px;z-index:2;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;position:relative;height:100%;}
  .bar{width:100%;border-radius:4px 4px 0 0;transition:all 0.25s ease;opacity:0.35;}
  .bar-col.active .bar{opacity:1;}
  .bar-col:hover .bar{opacity:0.75;}
  .bar-log{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted);white-space:nowrap;}
  .cursor-line{position:absolute;left:20px;right:20px;height:1.5px;z-index:5;pointer-events:none;transition:top 0.3s cubic-bezier(0.4,0,0.2,1);}
  .cursor-line::before{content:'';position:absolute;left:0;right:0;height:100%;background:white;opacity:0.9;}
  .cursor-label{position:absolute;right:0;top:-18px;font-size:10px;color:white;background:var(--surface);padding:2px 6px;border-radius:4px;border:0.5px solid rgba(255,255,255,0.2);white-space:nowrap;}
  .cursor-tri{position:absolute;left:-8px;top:-4px;width:0;height:0;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;border-right:8px solid white;}
  .detail-card{background:var(--surface);border:0.5px solid var(--border);border-radius:16px;padding:24px 28px;}
  .detail-top{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;flex-wrap:wrap;}
  .detail-log{font-family:'DM Serif Display',serif;font-size:52px;line-height:1;font-style:italic;}
  .detail-level{font-family:'DM Serif Display',serif;font-size:28px;}
  .detail-mode{font-size:11px;padding:4px 12px;border-radius:20px;letter-spacing:0.05em;text-transform:uppercase;margin-left:auto;}
  .drive-quote{font-size:13px;color:var(--muted);font-style:italic;font-family:'DM Serif Display',serif;margin-bottom:20px;padding-left:12px;border-left:2px solid var(--border);}
  .hbar-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
  .hbar-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;min-width:76px;}
  .hbar-track{flex:1;height:4px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;}
  .hbar-fill{height:100%;border-radius:2px;transition:width 0.4s ease;}
  .hbar-pct{font-size:12px;min-width:34px;text-align:right;}
  .attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 20px;}
  .attr-cell{display:flex;flex-direction:column;gap:3px;}
  .attr-key{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;}
  .attr-val{font-size:13px;}
  .nav{display:flex;align-items:center;gap:12px;justify-content:center;}
  .nav-btn{background:var(--surface);border:0.5px solid rgba(255,255,255,0.12);color:var(--text);font-family:'DM Mono',monospace;font-size:12px;padding:8px 20px;border-radius:8px;cursor:pointer;transition:background 0.15s;}
  .nav-btn:hover{background:rgba(255,255,255,0.06);}
  .nav-count{font-size:11px;color:var(--muted);min-width:52px;text-align:center;}
  .key-hint{font-size:10px;color:var(--muted);text-align:center;letter-spacing:0.05em;text-transform:uppercase;}
  .quiz-wrap{display:flex;flex-direction:column;gap:16px;}
  .prog-row{display:flex;align-items:center;gap:10px;}
  .prog-track{flex:1;height:4px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;}
  .prog-fill{height:100%;background:#7f77dd;border-radius:2px;transition:width 0.3s ease;}
  .prog-lbl{font-size:12px;color:var(--muted);min-width:40px;text-align:right;}
  .q-card{background:var(--surface);border:0.5px solid var(--border);border-radius:16px;padding:20px 20px 16px;}
  .q-text{font-size:15px;font-weight:500;margin-bottom:16px;line-height:1.5;}
  .opts{display:flex;flex-direction:column;gap:8px;}
  .opt{padding:11px 14px;border:0.5px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);cursor:pointer;transition:background 0.12s,border-color 0.12s;text-align:left;background:transparent;font-family:'DM Mono',monospace;}
  .opt:hover{background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.15);}
  .opt.selected{background:rgba(127,119,221,0.15);border-color:#7f77dd;color:#b3b0ff;}
  .qnav-row{display:flex;gap:10px;justify-content:flex-end;}
  .qbtn{padding:8px 20px;font-size:13px;font-family:'DM Mono',monospace;border:0.5px solid rgba(255,255,255,0.15);border-radius:8px;background:transparent;color:var(--text);cursor:pointer;transition:background 0.15s;}
  .qbtn:hover{background:rgba(255,255,255,0.06);}
  .qbtn:disabled{opacity:0.3;cursor:default;}
  .qbtn.primary{background:#7f77dd;border-color:#7f77dd;color:#fff;}
  .qbtn.primary:hover{background:#534ab7;}
  .result-card{background:var(--surface);border:0.5px solid var(--border);border-radius:16px;padding:28px 24px 24px;display:flex;flex-direction:column;gap:20px;}
  .res-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .res-log{font-family:'DM Serif Display',serif;font-size:52px;line-height:1;font-style:italic;}
  .res-level{font-family:'DM Serif Display',serif;font-size:26px;}
  .res-badge{font-size:11px;padding:4px 12px;border-radius:20px;letter-spacing:0.05em;text-transform:uppercase;margin-left:auto;}
  .res-drive{font-size:13px;color:var(--muted);font-style:italic;font-family:'DM Serif Display',serif;padding-left:12px;border-left:2px solid var(--border);}
  .res-attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px;}
  .res-attr{display:flex;flex-direction:column;gap:2px;}
  .res-k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;}
  .res-v{font-size:13px;}
  .section-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;}
  .report-block{background:rgba(255,255,255,0.03);border:0.5px solid var(--border);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;}
  .report-row{display:flex;align-items:flex-start;gap:12px;}
  .report-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:1px;}
  .report-text{font-size:13px;line-height:1.6;color:var(--text);}
  .report-label{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:2px;}
  .sug-tabs{display:flex;gap:4px;margin-bottom:12px;}
  .sug-tab{padding:5px 14px;font-size:11px;font-family:'DM Mono',monospace;border-radius:6px;border:0.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;letter-spacing:0.04em;transition:all 0.15s;}
  .sug-tab.active{background:rgba(127,119,221,0.15);border-color:#7f77dd;color:#b3b0ff;}
  .suggestion-list{display:flex;flex-direction:column;gap:10px;}
  .sug-item{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,0.03);border:0.5px solid var(--border);border-radius:10px;padding:14px 16px;}
  .sug-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;margin-top:1px;}
  .sug-body{flex:1;}
  .sug-title{font-size:13px;font-weight:500;margin-bottom:4px;}
  .sug-desc{font-size:12px;color:var(--muted);line-height:1.6;}
  .breath-steps{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .breath-step{background:rgba(127,119,221,0.12);border:0.5px solid rgba(127,119,221,0.3);border-radius:6px;padding:4px 10px;font-size:11px;color:#b3b0ff;}
  .routine-time{display:inline-block;background:rgba(26,158,117,0.12);border:0.5px solid rgba(26,158,117,0.3);border-radius:6px;padding:3px 8px;font-size:10px;color:#80cbc4;margin-bottom:6px;letter-spacing:0.04em;}
  .next-level-banner{border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:16px;}
  .nl-log{font-family:'DM Serif Display',serif;font-size:36px;font-style:italic;line-height:1;}
  .nl-body{flex:1;}
  .nl-label{font-size:10px;text-transform:uppercase;letter-spacing:0.07em;opacity:0.7;margin-bottom:4px;}
  .nl-level{font-size:18px;font-weight:500;}
  .nl-desc{font-size:12px;opacity:0.75;margin-top:3px;line-height:1.5;}
  .res-btns{display:flex;gap:10px;flex-wrap:wrap;}
  @media(max-width:560px){.attrs,.res-attrs{grid-template-columns:repeat(2,1fr);}.detail-log,.res-log{font-size:36px;}.detail-level,.res-level{font-size:20px;}}
</style>
</head>
<body>
<header>
  <h1>Map of Consciousness</h1>
  <p>Dr. David R. Hawkins · Scale of Human Awareness</p>
</header>
<div class="tabs">
  <button class="tab active" onclick="showTab('chart')">Chart</button>
  <button class="tab" onclick="showTab('quiz')">Self-Assessment Quiz</button>
</div>
<div class="main">
  <div class="panel visible" id="panel-chart">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--victim)"></div>Victim / Abuser</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--empower)"></div>Self-Empowerment</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--realize)"></div>Self-Realization</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--spirit)"></div>Spiritual</div>
    </div>
    <div class="chart-wrap" id="chartWrap">
      <div class="cursor-line" id="cursorLine"><div class="cursor-tri"></div><div class="cursor-label" id="cursorLabel">200 · Courage</div></div>
      <div class="bars" id="barsEl"></div>
    </div>
    <div class="detail-card" id="detailCard">
      <div class="detail-top">
        <span class="detail-log" id="dLog">200</span>
        <span class="detail-level" id="dLevel">Courage</span>
        <span class="detail-mode" id="dMode"></span>
      </div>
      <div class="drive-quote" id="dDrive"></div>
      <div class="hbar-row">
        <span class="hbar-lbl">Happiness</span>
        <div class="hbar-track"><div class="hbar-fill" id="happFill"></div></div>
        <span class="hbar-pct" id="happPct"></span>
      </div>
      <div class="attrs" id="attrsGrid"></div>
    </div>
    <div class="nav">
      <button class="nav-btn" onclick="move(-1)">← prev</button>
      <span class="nav-count" id="navCount">9 / 17</span>
      <button class="nav-btn" onclick="move(1)">next →</button>
    </div>
    <div class="key-hint">or use ← → arrow keys</div>
  </div>
  <div class="panel" id="panel-quiz">
    <div class="quiz-wrap">
      <div class="prog-row">
        <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
        <span class="prog-lbl" id="progLbl">0 / 20</span>
      </div>
      <div id="qArea"></div>
    </div>
  </div>
</div>

const allSuggestions={
  "Victim/Abuser":{

      general:[

      routine:[

    1000:{
      general:[{icon:"∞",t:"You are already complete",d:"At Enlightenment there is nothing to improve and nowhere to go. The journey is over. Simply be."}],
      breathing:[{icon:"🌬️",t:"All breath is sacred",d:"There is no technique at this level. Every breath is the universe breathing. Simply notice.",steps:["Simply breathe","Nothing more is needed"]}],
      routine:[{icon:"✨",t:"Every moment is the practice",d:"Waking, eating, walking, sleeping — all are the same. There is no routine because there is no separation between practice and life.",time:"All of life"}],
    },
  },
};

function getSugData(lvl){
  const m=lvl.mode;const s=allSuggestions[m];
  if(!s)return{general:[],breathing:[],routine:[]};
  if(s[lvl.log])return s[lvl.log];
  const keys=Object.keys(s).map(Number).sort((a,b)=>a-b);
  const closest=keys.reduce((a,b)=>Math.abs(b-lvl.log)<Math.abs(a-lvl.log)?b:a);
  return s[closest]||{general:[],breathing:[],routine:[]};
}

function getReport(lvl){
  const reports={
    "Victim/Abuser":{strength:"You are aware enough to take this assessment — self-awareness is itself a sign of growth. The fact that you are seeking understanding shows a part of you that wants change.",challenge:"At this level, life feels like something happening to you rather than something you participate in. Survival feels threatened and others are often seen as obstacles.",pattern:"The dominant pattern is reactive — responding to external events from fear, anger, or collapse rather than inner stability."},
    "Self-Empowerment":{strength:"You have crossed the critical threshold of 200 — one of the most significant leaps on the entire scale. You possess genuine inner resources and the capacity to navigate life's challenges.",challenge:"The primary growth edge is moving from personal empowerment to genuine care for others. The risk is using your strength primarily for personal gain rather than shared flourishing.",pattern:"The dominant pattern is proactive — you take responsibility for your outcomes and possess real agency. The next step is extending that agency outward in service of others."},
    "Self-Realization":{strength:"You operate from a fundamentally positive orientation toward life and others. Love, understanding, and forgiveness are natural parts of your experience rather than aspirations.",challenge:"The primary edge is moving from personal to universal realisation — from 'I am doing well' to 'we are all one.' This requires releasing the last subtle forms of separation.",pattern:"The dominant pattern is expansive — your energy naturally uplifts those around you. The next step is deepening into states where the personal self begins to dissolve."},
    "Spiritual":{strength:"You operate from a state of being that transcends ordinary human experience. Your presence is a gift to all those around you.",challenge:"At these levels, the language of challenge no longer applies. There is only deepening into what already is.",pattern:"The dominant pattern is radiance — you do not act so much as allow action to move through you."},
  };
  return reports[lvl.mode]||reports["Victim/Abuser"];
}

// ── CHART ──
let current=8;
const chartH=340;
const logMin=Math.log10(20),logMax=Math.log10(1000);
function barH(log){return Math.round(((Math.log10(log)-logMin)/(logMax-logMin))*chartH*0.88+chartH*0.07);}
const barsEl=document.getElementById('barsEl');
const barEls=[];
levels.forEach((d,i)=>{
  const col=document.createElement('div');col.className='bar-col';
  const bar=document.createElement('div');bar.className='bar';
  bar.style.height=barH(d.log)+'px';bar.style.background=modeColors[d.mode].bright;
  const lbl=document.createElement('span');lbl.className='bar-log';lbl.textContent=d.log;
  col.appendChild(bar);col.appendChild(lbl);
  col.addEventListener('click',()=>setLevel(i));
  barsEl.appendChild(col);barEls.push({col,bar,h:barH(d.log)});
});
const cursorLine=document.getElementById('cursorLine');
const cursorLabel=document.getElementById('cursorLabel');
const chartWrap=document.getElementById('chartWrap');
function cursorTop(i){const pt=28,pb=36;const avail=chartWrap.offsetHeight-pt-pb;return pt+(avail*(1-barEls[i].h/chartH));}
function setLevel(i){
  current=Math.max(0,Math.min(levels.length-1,i));
  const d=levels[current];const mc=modeColors[d.mode];
  cursorLine.style.top=cursorTop(current)+'px';
  cursorLabel.textContent=d.log+' · '+d.level;
  barEls.forEach((b,j)=>{b.col.classList.toggle('active',j===current);b.bar.style.background=modeColors[levels[j].mode].bright;});
  document.getElementById('dLog').textContent=d.log;
  document.getElementById('dLevel').textContent=d.level;
  const modeEl=document.getElementById('dMode');
  modeEl.textContent=d.mode;
  modeEl.setAttribute('style',mc.badge+';font-size:11px;padding:4px 12px;border-radius:20px;letter-spacing:0.05em;text-transform:uppercase;font-family:"DM Mono",monospace;margin-left:auto');
  document.getElementById('dDrive').textContent='"'+d.drive+'"';
  document.getElementById('happFill').style.width=d.happiness+'%';
  document.getElementById('happFill').style.background=mc.hap;
  document.getElementById('happPct').textContent=d.happiness+'%';
  document.getElementById('attrsGrid').innerHTML=[{k:'Emotion',v:d.emotion},{k:'Life-view',v:d.lifeView},{k:'God-view',v:d.godView},{k:'Process',v:d.process},{k:'Population',v:d.pop},{k:'Mode',v:d.mode}].map(x=>'<div class="attr-cell"><span class="attr-key">'+x.k+'</span><span class="attr-val">'+x.v+'</span></div>').join('');
  document.getElementById('navCount').textContent=(current+1)+' / '+levels.length;
}
function move(dir){setLevel(current+dir);}
document.addEventListener('keydown',e=>{if(document.getElementById('panel-chart').classList.contains('visible')){if(e.key==='ArrowRight'||e.key==='ArrowUp')move(1);if(e.key==='ArrowLeft'||e.key==='ArrowDown')move(-1);}});
window.addEventListener('resize',()=>{cursorLine.style.top=cursorTop(current)+'px';});
setLevel(current);

// ── QUIZ ──
const questions=[
  {text:"When things go wrong in your life, your first instinct is…",opts:[{text:"It's my fault — I'm the problem",score:20},{text:"I feel crushed and can't move on",score:75},{text:"I get angry and want to blame someone",score:150},{text:"I feel anxious but try to manage it",score:100},{text:"I accept it and look for what I can do",score:350},{text:"I trust that things will work out",score:250}]},
  {text:"How do you generally feel about other people?",opts:[{text:"Most people are out to get me",score:100},{text:"People disappoint me constantly",score:125},{text:"I have to be better than others to matter",score:175},{text:"People are basically good and capable",score:350},{text:"I love people and want to help them grow",score:500},{text:"We are all connected at a deeper level",score:540}]},
  {text:"When you wake up in the morning, you mostly feel…",opts:[{text:"Dread — another hard day ahead",score:50},{text:"Anxious about what could go wrong",score:100},{text:"Fine — nothing special either way",score:250},{text:"Optimistic and ready to take on the day",score:310},{text:"Grateful and at peace",score:540},{text:"A quiet, deep sense of joy",score:600}]},
  {text:"How do you handle someone who disagrees with you?",opts:[{text:"I feel humiliated and shut down",score:20},{text:"I get irritated and want to prove them wrong",score:150},{text:"I feel hurt but keep it inside",score:75},{text:"I listen and try to understand their view",score:400},{text:"I welcome it — different perspectives help me grow",score:350},{text:"I feel compassion — we all see things differently",score:500}]},
  {text:"What motivates you most in life?",opts:[{text:"Getting what I want before others do",score:125},{text:"Proving I am better than those around me",score:175},{text:"Surviving and staying safe",score:100},{text:"Learning, growing, and improving myself",score:400},{text:"Making the world a better place",score:500},{text:"Experiencing the joy of being alive",score:540}]},
  {text:"How do you feel about your past mistakes?",opts:[{text:"I am deeply ashamed — I am a bad person",score:20},{text:"I feel guilty and keep punishing myself",score:30},{text:"I regret them and feel sad",score:75},{text:"I've accepted them and moved forward",score:350},{text:"They taught me valuable lessons",score:400},{text:"They shaped me into who I am — I'm at peace",score:540}]},
  {text:"When you see someone suffering, you feel…",opts:[{text:"Indifferent — it's not my problem",score:175},{text:"Uncomfortable and want to avoid it",score:50},{text:"Sad but unsure what to do",score:75},{text:"A genuine desire to help if I can",score:310},{text:"Deep empathy and love for them",score:500},{text:"Oneness — their pain is my pain",score:540}]},
  {text:"How do you feel about uncertainty and the unknown?",opts:[{text:"It terrifies me",score:100},{text:"It frustrates and angers me",score:150},{text:"I try to control everything to avoid it",score:175},{text:"I accept it as part of life",score:350},{text:"I embrace it — life is an adventure",score:310},{text:"I am at peace with not knowing",score:600}]},
  {text:"How would you describe your relationship with yourself?",opts:[{text:"I hate myself or feel worthless",score:20},{text:"I'm hard on myself — never good enough",score:30},{text:"I'm okay but wish I were different",score:125},{text:"I respect myself and my journey",score:250},{text:"I love and accept myself fully",score:500},{text:"I see myself as part of something greater",score:600}]},
  {text:"What best describes your outlook on the future?",opts:[{text:"There's no point — nothing will change",score:50},{text:"I'm worried about what's coming",score:100},{text:"I'll manage whatever comes my way",score:200},{text:"The future is full of possibilities",score:310},{text:"I am excited to keep evolving",score:400},{text:"All is well — now and always",score:600}]},
  {text:"How do you typically respond to criticism?",opts:[{text:"I collapse and feel worthless",score:20},{text:"I feel deeply hurt and withdraw",score:75},{text:"I get defensive and push back hard",score:150},{text:"I feel stung but reflect on it later",score:200},{text:"I consider it openly and take what's useful",score:400},{text:"I welcome it as a gift for my growth",score:350}]},
  {text:"How connected do you feel to other people in general?",opts:[{text:"Completely alone — no one understands me",score:50},{text:"I keep people at a distance to stay safe",score:100},{text:"I connect but always feel slightly separate",score:250},{text:"I have meaningful connections and feel part of a community",score:350},{text:"I feel a deep bond with most people I meet",score:500},{text:"I feel a sense of oneness with all beings",score:540}]},
  {text:"When you achieve something, you typically feel…",opts:[{text:"Nothing — it doesn't matter anyway",score:50},{text:"Relief that I didn't fail",score:100},{text:"Pride and superiority over others",score:175},{text:"Satisfied and quietly confident",score:250},{text:"Grateful and eager to share my success",score:400},{text:"Joyful — and happy for everyone who helped",score:500}]},
  {text:"How do you relate to money and material things?",opts:[{text:"I feel I never have enough and fear losing what I have",score:125},{text:"I resent people who have more than me",score:150},{text:"I work hard to be better off than others",score:175},{text:"Money is a tool — I use it and don't stress about it",score:250},{text:"I feel abundant and enjoy sharing what I have",score:400},{text:"I trust that my needs are always met",score:500}]},
  {text:"How do you handle a major personal failure?",opts:[{text:"I want to disappear or give up entirely",score:20},{text:"I punish myself for weeks or months",score:30},{text:"I get angry at myself or others",score:150},{text:"I feel bad but pick myself up and continue",score:200},{text:"I analyse what went wrong and adjust my approach",score:400},{text:"I accept it as part of the journey and move forward",score:540}]},
  {text:"What is your relationship with forgiveness?",opts:[{text:"I cannot forgive — the hurt is too deep",score:75},{text:"I forgive eventually but never forget",score:150},{text:"I say I forgive but still carry resentment",score:175},{text:"I forgive when I understand the other person's perspective",score:350},{text:"Forgiveness comes naturally — holding grudges feels pointless",score:500},{text:"I see nothing to forgive — everyone is doing their best",score:540}]},
  {text:"How do you feel when someone else succeeds?",opts:[{text:"Invisible — like my own failure is highlighted",score:75},{text:"Envious and quietly resentful",score:125},{text:"Competitive — I need to do better than them",score:175},{text:"Happy for them but focused on my own path",score:310},{text:"Genuinely inspired and happy for them",score:400},{text:"Joyful — their success feels like mine too",score:540}]},
  {text:"What is your typical inner narrative during a hard day?",opts:[{text:"'Why does this always happen to me?'",score:75},{text:"'Everything is against me'",score:100},{text:"'I have to fight to get through this'",score:150},{text:"'This is hard but I can handle it'",score:200},{text:"'What can I learn from this?'",score:400},{text:"'This too shall pass — all is well'",score:540}]},
  {text:"How do you feel about the idea of death?",opts:[{text:"Terrified — I try not to think about it",score:100},{text:"Sad and anxious when it crosses my mind",score:75},{text:"I accept it intellectually but it still unsettles me",score:250},{text:"I've made peace with it as part of life",score:350},{text:"I see it as a transition, not an ending",score:500},{text:"There is no death — only transformation of consciousness",score:600}]},
  {text:"When you help others, what is usually driving you?",opts:[{text:"Fear of what they'll think if I don't",score:100},{text:"Guilt — I feel I have to",score:30},{text:"It makes me feel needed and important",score:175},{text:"It feels good and I genuinely want to contribute",score:310},{text:"Love — I care about their wellbeing as much as my own",score:500},{text:"There is no 'I' helping — service flows through me",score:600}]},
];

function closestLevel(score){return levels.reduce((a,b)=>Math.abs(b.log-score)<Math.abs(a.log-score)?b:a);}
let qCurrent=0,qAnswers=[],qSelected=null;
const TOTAL=questions.length;

function renderQuiz(){
  const pct=Math.round((qCurrent/TOTAL)*100);
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progLbl').textContent=qCurrent+' / '+TOTAL;
  if(qCurrent>=TOTAL){showQuizResult();return;}
  const q=questions[qCurrent];qSelected=null;
  document.getElementById('qArea').innerHTML=
    '<div class="q-card"><div class="q-text">Q'+(qCurrent+1)+' of '+TOTAL+'. '+q.text+'</div>'+
    '<div class="opts">'+q.opts.map((o,i)=>'<button class="opt" onclick="qPick('+i+')">'+o.text+'</button>').join('')+'</div></div>'+
    '<div class="qnav-row">'+(qCurrent>0?'<button class="qbtn" onclick="qBack()">Back</button>':'')+
    '<button class="qbtn primary" id="qNext" onclick="qNext()" disabled>Next</button></div>';
  if(qAnswers[qCurrent]!==undefined)qPick(qAnswers[qCurrent],true);
}

function qPick(i,restore){qSelected=i;document.querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('selected',j===i));document.getElementById('qNext').disabled=false;if(!restore)qAnswers[qCurrent]=i;}
function qNext(){if(qSelected===null)return;qAnswers[qCurrent]=qSelected;qCurrent++;renderQuiz();}
function qBack(){if(qCurrent>0){qCurrent--;renderQuiz();}}

let activeSugTab='general';
function switchSugTab(tab,lvl){
  activeSugTab=tab;
  document.querySelectorAll('.sug-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  document.getElementById('sugContent').innerHTML=renderSugList(tab,lvl);
}

function renderSugList(tab,lvl){
  const data=getSugData(lvl);
  const items=data[tab]||[];
  if(!items.length)return '<div style="color:var(--muted);font-size:13px;">No specific suggestions for this tab at this level.</div>';
  return items.map(s=>{
    let extra='';
    if(tab==='breathing'&&s.steps){
      extra='<div class="breath-steps">'+s.steps.map(st=>'<span class="breath-step">'+st+'</span>').join('')+'</div>';
    }
    if(tab==='routine'&&s.time){
      extra='<div class="routine-time">'+s.time+'</div>';
    }
    return '<div class="sug-item"><div class="sug-icon" style="background:rgba(255,255,255,0.05)">'+s.icon+'</div><div class="sug-body">'+
      (tab==='routine'&&s.time?'<div class="routine-time">'+s.time+'</div>':'')+
      '<div class="sug-title">'+s.t+'</div><div class="sug-desc">'+s.d+'</div>'+
      (tab==='breathing'&&s.steps?'<div class="breath-steps">'+s.steps.map(st=>'<span class="breath-step">'+st+'</span>').join('')+'</div>':'')+
    '</div></div>';
  }).join('');
}

function showQuizResult(){
  document.getElementById('progFill').style.width='100%';
  document.getElementById('progLbl').textContent=TOTAL+' / '+TOTAL;
  const total=qAnswers.reduce((s,ai,qi)=>s+questions[qi].opts[ai].score,0);
  const avg=Math.round(total/TOTAL);
  const lvl=closestLevel(avg);
  const mc=modeColors[lvl.mode];
  const report=getReport(lvl);
  const idx=levels.findIndex(l=>l.log===lvl.log);
  const nextLvl=idx<levels.length-1?levels[idx+1]:null;
  let nextBanner='';
  if(nextLvl){const nmc=modeColors[nextLvl.mode];nextBanner='<div><div class="section-title">Your next level</div><div class="next-level-banner" style="'+nmc.banner+'"><div class="nl-log">'+nextLvl.log+'</div><div class="nl-body"><div class="nl-label">Next milestone</div><div class="nl-level">'+nextLvl.level+'</div><div class="nl-desc">Emotion: '+nextLvl.emotion+' &nbsp;·&nbsp; '+nextLvl.happiness+'% happiness rate</div></div></div></div>';}

  activeSugTab='general';
  document.getElementById('qArea').innerHTML=
    '<div class="result-card">'+
    '<div class="res-top"><span class="res-log">'+lvl.log+'</span><span class="res-level">'+lvl.level+'</span><span class="res-badge" style="'+mc.badge+'">'+lvl.mode+'</span></div>'+
    '<div class="res-drive">"'+lvl.drive+'"</div>'+
    '<div class="hbar-row"><span class="hbar-lbl">Happiness</span><div class="hbar-track"><div class="hbar-fill" style="width:'+lvl.happiness+'%;background:'+mc.hap+'"></div></div><span class="hbar-pct">'+lvl.happiness+'%</span></div>'+
    '<div class="res-attrs">'+[{k:'Emotion',v:lvl.emotion},{k:'Life-view',v:lvl.lifeView},{k:'God-view',v:lvl.godView},{k:'Process',v:lvl.process},{k:'Population',v:lvl.pop},{k:'Your score',v:avg}].map(x=>'<div class="res-attr"><span class="res-k">'+x.k+'</span><span class="res-v">'+x.v+'</span></div>').join('')+'</div>'+
    '<div><div class="section-title">Assessment report</div><div class="report-block">'+
    '<div class="report-row"><div class="report-icon" style="background:rgba(127,119,221,0.2);color:#b3b0ff">+</div><div><div class="report-label">Strength</div><div class="report-text">'+report.strength+'</div></div></div>'+
    '<div class="report-row"><div class="report-icon" style="background:rgba(196,125,26,0.2);color:#ffcc80">!</div><div><div class="report-label">Challenge</div><div class="report-text">'+report.challenge+'</div></div></div>'+
    '<div class="report-row"><div class="report-icon" style="background:rgba(26,158,117,0.2);color:#80cbc4">~</div><div><div class="report-label">Pattern</div><div class="report-text">'+report.pattern+'</div></div></div>'+
    '</div></div>'+
    nextBanner+
    '<div><div class="section-title">How to raise your level</div>'+
    '<div class="sug-tabs">'+
    '<button class="sug-tab active" data-tab="general" onclick="switchSugTab(\'general\',levels['+idx+'])">💡 Suggestions</button>'+
    '<button class="sug-tab" data-tab="breathing" onclick="switchSugTab(\'breathing\',levels['+idx+'])">🌬️ Breathing</button>'+
    '<button class="sug-tab" data-tab="routine" onclick="switchSugTab(\'routine\',levels['+idx+'])">📅 Daily Routine</button>'+
    '</div>'+
    '<div class="suggestion-list" id="sugContent">'+renderSugList('general',lvl)+'</div></div>'+
    '<div class="res-btns"><button class="qbtn" onclick="qRestart()">Retake quiz</button><button class="qbtn primary" onclick="showTab(\'chart\')">View on chart</button></div>'+
    '</div>';

  const cidx=levels.findIndex(l=>l.log===lvl.log);
  if(cidx>=0)setLevel(cidx);
}

function qRestart(){qCurrent=0;qAnswers=[];qSelected=null;activeSugTab='general';renderQuiz();}
function showTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['chart','quiz'][i]===tab));
  document.getElementById('panel-chart').classList.toggle('visible',tab==='chart');
  document.getElementById('panel-quiz').classList.toggle('visible',tab==='quiz');
  if(tab==='quiz')renderQuiz();
  if(tab==='chart')cursorLine.style.top=cursorTop(current)+'px';
}
</script>
</body>
</html>
